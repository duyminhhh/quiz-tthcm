<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="dark">
<title>Quiz Tư tưởng Hồ Chí Minh - 340 câu</title>
<style>
:root{
  --bg:#0d1422;
  --bg2:#111b2e;
  --panel:#151f32;
  --panel-2:#1a263b;
  --option:#1c2940;
  --option-hover:#23334e;
  --line:#2a3953;
  --text:#e9eef6;
  --muted:#9aabc2;
  --accent:#72d6c9;
  --accent-2:#8fbdf4;
  --good:#65d98b;
  --good-bg:#153824;
  --bad:#ff8a9a;
  --bad-bg:#431f2a;
  --warn:#f4cf70;
  --shadow:0 16px 40px rgba(0,0,0,.22);
  --radius:18px;
  --base-font:16px;
}
*{box-sizing:border-box}
html{scroll-behavior:smooth}
body{
  margin:0;
  min-height:100vh;
  color:var(--text);
  background:
    radial-gradient(circle at 15% -10%,rgba(114,214,201,.10),transparent 30rem),
    radial-gradient(circle at 100% 0%,rgba(143,189,244,.09),transparent 28rem),
    linear-gradient(180deg,var(--bg),#0a111d 100%);
  font-family:Inter,ui-sans-serif,system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif;
  font-size:var(--base-font);
  line-height:1.62;
}
button{font:inherit}
button:focus-visible{outline:3px solid rgba(114,214,201,.55);outline-offset:3px}
.app{max-width:1500px;margin:0 auto;padding:24px}
.topbar{
  position:sticky;top:0;z-index:20;
  margin:-24px -24px 22px;padding:14px 24px;
  background:rgba(13,20,34,.88);backdrop-filter:blur(14px);
  border-bottom:1px solid rgba(255,255,255,.06)
}
.topbar-inner{max-width:1452px;margin:0 auto;display:flex;align-items:center;gap:18px}
.brand{min-width:255px}
.brand-title{font-size:1.02rem;font-weight:800;letter-spacing:.01em}
.brand-sub{color:var(--muted);font-size:.78rem;margin-top:1px}
.global-progress{flex:1;min-width:180px}
.progress-row{display:flex;justify-content:space-between;gap:12px;color:var(--muted);font-size:.78rem;margin-bottom:6px}
.progress-track{height:7px;border-radius:999px;background:#223049;overflow:hidden}
.progress-fill{height:100%;width:0;background:linear-gradient(90deg,var(--accent),var(--accent-2));transition:width .25s ease}
.top-actions{display:flex;align-items:center;gap:8px}
.small-btn,.reset-btn,.nav-btn{
  border:1px solid var(--line);background:var(--panel-2);color:var(--text);
  border-radius:12px;cursor:pointer;transition:.15s ease
}
.small-btn{width:38px;height:38px;font-weight:800}
.small-btn:hover,.nav-btn:hover{background:#23334d;border-color:#3a4d6b}
.layout{display:grid;grid-template-columns:285px minmax(0,1fr);gap:24px;align-items:start}
.sidebar{
  position:sticky;top:94px;max-height:calc(100vh - 118px);overflow:auto;
  background:rgba(21,31,50,.88);border:1px solid var(--line);border-radius:var(--radius);box-shadow:var(--shadow);
  padding:16px
}
.side-title{font-size:.78rem;letter-spacing:.13em;text-transform:uppercase;color:var(--muted);font-weight:800;margin:2px 4px 14px}
.chapter-group{padding:12px 0;border-top:1px solid rgba(255,255,255,.055)}
.chapter-group:first-of-type{border-top:0;padding-top:0}
.chapter-head{display:flex;justify-content:space-between;align-items:center;gap:8px;margin-bottom:8px}
.chapter-name{font-weight:800}
.reset-mini{border:0;background:transparent;color:#aebcd0;cursor:pointer;font-size:.77rem;padding:5px 7px;border-radius:8px}
.reset-mini:hover{background:rgba(255,255,255,.055);color:#fff}
.section-nav{display:block;width:100%;text-align:left;border:1px solid transparent;background:transparent;color:#c7d2e1;padding:10px 11px;border-radius:11px;cursor:pointer;margin:4px 0}
.section-nav:hover{background:#1d2a40}
.section-nav.active{background:#20374a;border-color:#31536a;color:#e9fffb}
.section-nav-top{display:flex;justify-content:space-between;gap:8px;font-weight:700}
.section-nav-meta{display:flex;justify-content:space-between;gap:8px;font-size:.75rem;color:var(--muted);margin-top:2px}
.side-note{margin:14px 2px 2px;color:#8fa1b8;font-size:.75rem;line-height:1.5}
.main{min-width:0}
.hero{
  background:linear-gradient(135deg,rgba(26,38,59,.98),rgba(19,31,49,.98));
  border:1px solid var(--line);border-radius:22px;box-shadow:var(--shadow);padding:24px;margin-bottom:18px
}
.eyebrow{color:var(--accent);font-size:.78rem;font-weight:900;letter-spacing:.14em;text-transform:uppercase}
.hero h1{margin:5px 0 3px;font-size:clamp(1.55rem,2.8vw,2.35rem);line-height:1.22}
.hero p{margin:0;color:var(--muted)}
.hero-tools{display:flex;flex-wrap:wrap;align-items:center;gap:10px;margin-top:18px}
.pill{border:1px solid #31445f;background:#111b2e;border-radius:999px;padding:7px 11px;color:#b8c7d9;font-size:.8rem}
.reset-btn{padding:9px 13px;font-weight:800;margin-left:auto}
.reset-btn:hover{background:#3b2530;border-color:#65404c;color:#ffdbe0}
.tool-btn{border:1px solid var(--line);background:var(--panel-2);color:var(--text);border-radius:12px;cursor:pointer;padding:9px 13px;font-weight:700;font-size:.82rem;white-space:nowrap;transition:.15s ease}
.tool-btn:hover{background:#23334d;border-color:#3a4d6b}
.section-progress-wrap{margin:14px 0 22px;background:rgba(21,31,50,.7);border:1px solid var(--line);border-radius:15px;padding:12px 14px}
.section-progress-label{display:flex;justify-content:space-between;gap:12px;font-size:.8rem;color:var(--muted);margin-bottom:7px}
.questions{display:grid;gap:15px}
.question-card{
  background:rgba(21,31,50,.95);border:1px solid var(--line);border-radius:18px;padding:20px;
  box-shadow:0 9px 26px rgba(0,0,0,.13)
}
.question-card.answered{border-color:#334862}
.q-head{display:flex;gap:13px;align-items:flex-start}
.q-num{flex:0 0 auto;min-width:55px;height:30px;padding:0 9px;border-radius:9px;background:#22324a;color:#cde3f5;display:grid;place-items:center;font-size:.78rem;font-weight:900;letter-spacing:.03em}
.q-text{font-size:1.02rem;font-weight:760;line-height:1.56;color:#f0f4fa}
.options{display:grid;gap:9px;margin-top:15px;margin-left:68px}
.option{
  width:100%;display:grid;grid-template-columns:36px minmax(0,1fr) 24px;align-items:start;gap:9px;
  text-align:left;border:1px solid #2c3d58;background:var(--option);color:#dbe4ef;
  border-radius:13px;padding:12px 13px;cursor:pointer;transition:background .14s ease,border-color .14s ease,transform .08s ease
}
.option:hover:not(:disabled){background:var(--option-hover);border-color:#3a5374;transform:translateY(-1px)}
.option:disabled{cursor:default;opacity:.88}
.opt-letter{font-weight:900;color:#9ec7e6}
.opt-icon{font-weight:1000;text-align:center;line-height:1.4}
.option.correct-selected{background:var(--good-bg);border-color:#337b4b;color:#dcffe7}
.option.correct-selected .opt-letter,.option.correct-selected .opt-icon{color:var(--good)}
.option.wrong-selected{background:var(--bad-bg);border-color:#864151;color:#ffe2e6}
.option.wrong-selected .opt-letter,.option.wrong-selected .opt-icon{color:var(--bad)}
.feedback{margin:12px 0 0 68px;border-radius:12px;padding:11px 13px;font-size:.9rem}
.feedback.correct{border:1px solid #2e7044;background:#12301f;color:#c9f8d7}
.feedback.wrong{border:1px solid #66434d;background:#2d2028;color:#ffd8de}
.feedback strong{color:#fff}
.exam-card{border:1px solid #3a4d6b;background:linear-gradient(135deg,#16233a,#111b2e);border-radius:16px;padding:14px 16px;margin:4px 0 10px}
.exam-card .exam-title{font-weight:800;font-size:.92rem;color:#e9eef6}
.exam-card .exam-sub{color:var(--muted);font-size:.76rem;margin-top:2px}
.exam-newbtn{margin-top:10px;width:100%;border:1px solid var(--line);background:var(--panel-2);color:var(--text);border-radius:11px;cursor:pointer;padding:9px 10px;font-weight:700;font-size:.82rem}
.exam-newbtn:hover{background:#23334e;border-color:#3a4d6b}
.src-tag{display:inline-block;margin:0 0 8px 68px;font-size:.72rem;color:var(--accent-2);background:#152238;border:1px solid #2a3953;border-radius:999px;padding:3px 9px}
.summary-banner{border:1px solid #2e7044;background:linear-gradient(135deg,#12301f,#0f2a1c);border-radius:16px;padding:18px 20px;margin-bottom:18px;text-align:center}
.summary-banner .sb-score{font-size:1.6rem;font-weight:900;color:#c9f8d7}
.summary-banner .sb-sub{color:#a8d9bb;font-size:.85rem;margin-top:4px}
.summary-banner button{margin-top:12px}
@media(max-width:760px){.src-tag{margin-left:0}}
.bottom-nav{display:flex;justify-content:space-between;gap:12px;margin:24px 0 55px}
.nav-btn{padding:11px 14px;font-weight:800;min-width:145px}
.nav-btn:disabled{opacity:.35;cursor:not-allowed}
.empty{padding:40px;text-align:center;color:var(--muted)}
.to-top{position:fixed;right:22px;bottom:22px;width:44px;height:44px;border-radius:50%;border:1px solid var(--line);background:#1a2a40;color:#e8f1fa;box-shadow:var(--shadow);cursor:pointer;opacity:0;pointer-events:none;transition:.2s}
.to-top.show{opacity:1;pointer-events:auto}
@media(max-width:980px){
  .app{padding:16px}.topbar{margin:-16px -16px 16px;padding:12px 16px}.brand{min-width:0}.brand-sub{display:none}
  .layout{grid-template-columns:1fr}.sidebar{position:relative;top:auto;max-height:none;display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px;padding:10px}
  .side-title,.side-note{display:none}.chapter-group{border:0;padding:0}.chapter-head{margin:0 0 4px}.chapter-name{font-size:.84rem}.reset-mini{display:none}
  .section-nav{padding:8px}.section-nav-meta{font-size:.7rem}
}
@media(max-width:680px){
  .topbar-inner{flex-wrap:wrap}.brand{width:100%}.global-progress{order:3;width:100%}.top-actions{margin-left:auto;position:absolute;right:16px;top:11px}
  .sidebar{grid-template-columns:1fr}.chapter-group{display:grid;grid-template-columns:1fr 1fr;gap:5px}.chapter-head{grid-column:1/-1}.chapter-group:first-of-type .section-nav{grid-column:1/-1}
  .hero{padding:18px}.question-card{padding:16px}.q-head{gap:10px}.q-num{min-width:47px}.options,.feedback{margin-left:0}.option{grid-template-columns:32px minmax(0,1fr) 22px;padding:11px}
  .reset-btn{margin-left:0;width:100%}.tool-btn{flex:1 1 calc(50% - 5px);text-align:center}.bottom-nav{gap:8px}.nav-btn{min-width:0;flex:1}
}
@media(prefers-reduced-motion:reduce){*{scroll-behavior:auto!important;transition:none!important}}
</style>
</head>
<body>
<div class="app">
  <header class="topbar">
    <div class="topbar-inner">
      <div class="brand">
        <div class="brand-title">Quiz Tư tưởng Hồ Chí Minh</div>
        <div class="brand-sub">340 câu · tự lưu tiến độ trên trình duyệt</div>
      </div>
      <div class="global-progress">
        <div class="progress-row"><span id="globalStat">0 / 340 câu đã làm</span><span id="globalScore">Đúng: 0</span></div>
        <div class="progress-track"><div class="progress-fill" id="globalFill"></div></div>
      </div>
      <div class="top-actions" aria-label="Cỡ chữ">
        <button class="small-btn" id="fontDown" type="button" title="Giảm cỡ chữ">A−</button>
        <button class="small-btn" id="fontUp" type="button" title="Tăng cỡ chữ">A+</button>
      </div>
    </div>
  </header>

  <div class="layout">
    <aside class="sidebar" id="sidebar" aria-label="Điều hướng chương"></aside>
    <main class="main">
      <section class="hero">
        <div class="eyebrow" id="eyebrow"></div>
        <h1 id="sectionTitle"></h1>
        <p id="sectionSubtitle"></p>
        <div class="hero-tools">
          <span class="pill" id="questionCount"></span>
          <span class="pill" id="sectionScore"></span>
          <button class="tool-btn" id="shuffleBtn" type="button">🔀 Trộn câu hỏi</button>
          <button class="tool-btn" id="restoreOrderBtn" type="button">↺ Thứ tự gốc</button>
          <button class="reset-btn" id="resetCurrent" type="button"></button>
        </div>
      </section>
      <div class="section-progress-wrap">
        <div class="section-progress-label"><span id="sectionStat"></span><span id="sectionPct"></span></div>
        <div class="progress-track"><div class="progress-fill" id="sectionFill"></div></div>
      </div>
      <section class="questions" id="questions"></section>
      <div class="bottom-nav">
        <button class="nav-btn" id="prevSection" type="button">← Mục trước</button>
        <button class="nav-btn" id="nextSection" type="button">Mục tiếp →</button>
      </div>
    </main>
  </div>
</div>
<button class="to-top" id="toTop" type="button" aria-label="Lên đầu trang">↑</button>
<script>
const QUIZ_DATA = [{"id":"chapter1","title":"Chương 1","questions":[{"number":1,"question":"Đại hội nào của Đảng Cộng sản Việt Nam xác định: \"Đảng phải đặc biệt coi trọng việc tổ chức học tập một cách có hệ thống tư tưởng, đạo đức tác phong của Chủ tịch Hồ Chí Minh trong toàn Đảng\"?","options":[{"letter":"A","text":"Đại hội V (1982)"},{"letter":"B","text":"Đại hội I (1935)"},{"letter":"C","text":"Đại hội III (1960)"},{"letter":"D","text":"Đại hội II (1951)"}],"page":1,"correct":0},{"number":2,"question":"Đại hội nào của Đảng Cộng sản Việt Nam xác định: \"Lấy chủ nghĩa Mác - Lênin và tư tưởng Hồ Chí Minh làm nền tảng tư tưởng và kim chỉ nam cho hành động\"?","options":[{"letter":"A","text":"Đại hội V (1982)"},{"letter":"B","text":"Đại hội VII (1991)"},{"letter":"C","text":"Đại hội VI (1986)"},{"letter":"D","text":"Đại hội VIII (1996)"}],"page":1,"correct":1},{"number":3,"question":"Tư tưởng Hồ Chí Minh và chủ nghĩa Mác - Lênin có vị trí như thế nào trong tư tưởng của Đảng?","options":[{"letter":"A","text":"Là nền tảng, là gốc"},{"letter":"B","text":"Là nền tảng, kim chỉ nam"},{"letter":"C","text":"Là kim chỉ nam, hạt nhân"},{"letter":"D","text":"Là kim chỉ nam, định hướng"}],"page":1,"correct":1},{"number":4,"question":"Theo Hồ Chí Minh: \"Người có kinh nghiệm mà không có lý luận\" cũng giống như:","options":[{"letter":"A","text":"Một mắt sáng, một mắt đen"},{"letter":"B","text":"Một mắt sáng, một mắt tối"},{"letter":"C","text":"Một mắt sáng, một mắt mờ"},{"letter":"D","text":"Một mắt sáng, một mắt mù"}],"page":1,"correct":2},{"number":5,"question":"Điền vào chỗ trống: \"Toàn Đảng hãy ra sức học tập đường lối chính trị, tác phong và đạo đức cách mạng của Hồ Chủ tịch; sự học tập ấy, là (...) làm cho Đảng mạnh và làm cho cách mạng đi mau đến thắng lợi hoàn toàn\".","options":[{"letter":"A","text":"điều kiện quan trọng"},{"letter":"B","text":"điều kiện tiên quyết"},{"letter":"C","text":"điều kiện hàng đầu"},{"letter":"D","text":"điều kiện bắt buộc"}],"page":1,"correct":1},{"number":6,"question":"Thuật ngữ tư tưởng Hồ Chí Minh được hiểu theo nghĩa:","options":[{"letter":"A","text":"Tư tưởng một cá nhân"},{"letter":"B","text":"Tư tưởng của một cộng đồng"},{"letter":"C","text":"Tư tưởng của một giai cấp, một dân tộc"},{"letter":"D","text":"Tư tưởng của một tập thể"}],"page":1,"correct":2},{"number":7,"question":"Điền vào chỗ trống: \"Trong quá trình hiện thực hóa hệ thống quan điểm của Hồ Chí Minh, cách mạng Việt Nam luôn (...) và phát triển hệ thống quan điểm đó trong những điều kiện mới\".","options":[{"letter":"A","text":"vận dụng và phát triển sáng tạo"},{"letter":"B","text":"có vận dụng trực tiếp"},{"letter":"C","text":"có sự vận dụng cụ thể"},{"letter":"D","text":"sự vận dụng gián tiếp"}],"page":1,"correct":0},{"number":8,"question":"Luận điểm: \"Không có lý luận cách mệnh, thì không có cách mệnh vận động... Chỉ có theo lí luận tiền phong, Đảng cách mệnh mới làm tròn trách nhiệm cách mệnh tiền phong\" là của ai?","options":[{"letter":"A","text":"Ăngghen"},{"letter":"B","text":"Lênin"},{"letter":"C","text":"Các Mác"},{"letter":"D","text":"Hồ Chí Minh"}],"page":2,"correct":1},{"number":9,"question":"Điền vào chỗ trống để hoàn thành câu trích trong Điếu văn của Ban Chấp hành Trung ương Đảng năm 1969: \"Dân tộc ta, nhân dân ta, non sông đất nước ta đã sinh ra HỒ CHỦ TỊCH, (...) và chính Người đã làm rạng rỡ dân tộc ta, nhân dân ta và non sông đất nước ta\".","options":[{"letter":"A","text":"người cộng sản lỗi lạc"},{"letter":"B","text":"danh nhân văn hóa thế giới"},{"letter":"C","text":"vị lãnh tụ thiên tài"},{"letter":"D","text":"người anh hùng dân tộc vĩ đại"}],"page":2,"correct":3},{"number":10,"question":"Vận dụng các nguyên tắc và quan điểm phương pháp luận trong nghiên cứu tư tưởng Hồ Chí Minh, hãy xác định đây là nội dung của phương pháp luận nào: \"Lý luận như cái \"kim chỉ nam\", nó chỉ phương hướng cho chúng ta trong công việc thực tế\"?","options":[{"letter":"A","text":"Thống nhất tính đảng và tính khoa học"},{"letter":"B","text":"Quan điểm lịch sử - cụ thể"},{"letter":"C","text":"Thống nhất lý luận và thực tiễn"},{"letter":"D","text":"Quan điểm toàn diện và hệ thống"}],"page":2,"correct":2},{"number":11,"question":"Tổ chức nào của Liên hợp quốc đã ghi nhận \"năm 1990 sẽ đánh dấu 100 năm Kỷ niệm Ngày sinh của Chủ tịch Hồ Chí Minh, anh hùng giải phóng dân tộc và nhà văn hóa kiệt xuất của Việt Nam\"?","options":[{"letter":"A","text":"IMF"},{"letter":"B","text":"WB"},{"letter":"C","text":"UNDP"},{"letter":"D","text":"UNESCO"}],"page":2,"correct":3},{"number":12,"question":"Điền vào chỗ trống: \"Lúc đầu, chính là chủ nghĩa (...), chứ chưa phải chủ nghĩa cộng sản đã đưa tôi tin theo Lênin, tin theo Quốc tế thứ 3\".","options":[{"letter":"A","text":"dân tộc"},{"letter":"B","text":"xã hội"},{"letter":"C","text":"yêu nước"},{"letter":"D","text":"tư bản"}],"page":2,"correct":2},{"number":13,"question":"Đại hội nào của Đảng Cộng sản Việt Nam khẳng định: \"Kiên định chủ nghĩa Mác - Lênin, tư tưởng Hồ Chí Minh, vận dụng sáng tạo và phát triển phù hợp với thực tiễn Việt Nam\"?","options":[{"letter":"A","text":"Đại hội XII (2016)"},{"letter":"B","text":"Đại hội XI (2011)"},{"letter":"C","text":"Đại hội X (2006)"},{"letter":"D","text":"Đại hội XIII (2021)"}],"page":2,"correct":0},{"number":14,"question":"Đối tượng của môn học tư tưởng Hồ Chí Minh là gì?","options":[{"letter":"A","text":"Sản sinh, vận dụng tư tưởng"},{"letter":"B","text":"Hiện thực hóa, vận dụng tư tưởng"},{"letter":"C","text":"Đảng vận dụng tư tưởng"},{"letter":"D","text":"Sản sinh, hiện thực hóa tư tưởng"}],"page":2,"correct":3},{"number":15,"question":"Từ khi ra đời cho đến nay, có bao nhiêu \"Cương lĩnh chính trị của Đảng\"?","options":[{"letter":"A","text":"5"},{"letter":"B","text":"3"},{"letter":"C","text":"6"},{"letter":"D","text":"4"}],"page":2,"correct":0},{"number":16,"question":"Vận dụng, kết hợp phương pháp nghiên cứu tư tưởng Hồ Chí Minh phải căn cứ vào:","options":[{"letter":"A","text":"Nội dung nghiên cứu"},{"letter":"B","text":"Thống kê tài liệu"},{"letter":"C","text":"Bài viết, bài nói"},{"letter":"D","text":"Phỏng vấn nhân chứng"}],"page":3,"correct":0},{"number":17,"question":"Văn kiện nào sau đây khẳng định: \"...HỒ CHỦ TỊCH, người anh hùng dân tộc vĩ đại, và chính Người đã làm rạng rỡ dân tộc ta, nhân dân ta và non sông đất nước ta\"?","options":[{"letter":"A","text":"Điếu văn của Ban Chấp hành Trung ương Đảng Lao động Việt Nam (9/1969)"},{"letter":"B","text":"Cương lĩnh xây dựng đất nước trong thời kỳ quá độ lên chủ nghĩa xã hội (Bổ sung, phát triển năm 2011)"},{"letter":"C","text":"Cương lĩnh chính trị đầu tiên của Đảng (2/1930)"},{"letter":"D","text":"Chính cương Đảng Lao động Việt Nam (2/1951)"}],"page":3,"correct":0},{"number":18,"question":"Tác phẩm nào của Hồ Chí Minh ghi rõ: \"Toàn Đảng toàn dân ta đoàn kết phấn đấu, xây dựng một nước Việt Nam hòa bình, thống nhất, độc lập, dân chủ và giàu mạnh, và góp phần xứng đáng vào sự nghiệp cách mang thế giới\"","options":[{"letter":"A","text":"Lịch sử nước ta"},{"letter":"B","text":"Di chúc"},{"letter":"C","text":"Đường cách mệnh"},{"letter":"D","text":"Tuyên ngôn độc lập"}],"page":3,"correct":1},{"number":19,"question":"Vận dụng các nguyên tắc và quan điểm phương pháp luận trong nghiên cứu tư tưởng Hồ Chí Minh, hãy xác định đây là nội dung của phương pháp luận nào: \"Việc nghiên cứu tư tưởng Hồ Chí Minh đòi hỏi phải dựa trên lập trường của giai cấp công nhân và thấm nhuần các quan điểm của Đảng Cộng sản Việt Nam\"?","options":[{"letter":"A","text":"Thống nhất tính đảng và tính khoa học"},{"letter":"B","text":"Quan điểm toàn diện và hệ thống"},{"letter":"C","text":"Thống nhất lý luận và thực tiễn"},{"letter":"D","text":"Quan điểm lịch sử - cụ thể"}],"page":3,"correct":0},{"number":20,"question":"Tư tưởng Hồ Chí Minh thuộc hệ tư tưởng nào?","options":[{"letter":"A","text":"Tư sản"},{"letter":"B","text":"Phong kiến"},{"letter":"C","text":"Mác - Lênin"},{"letter":"D","text":"Dân chủ tư sản"}],"page":3,"correct":2},{"number":21,"question":"Cương lĩnh chính trị đầu tiên của Đảng gồm những văn kiện nào?","options":[{"letter":"A","text":"Điều lệ vắn tắt của Đảng, Chánh cương vắn tắt của Đảng"},{"letter":"B","text":"Chánh cương vắn tắt của Đảng, Chương trình tóm tắt của Đảng"},{"letter":"C","text":"Chánh cương vắn tắt của Đảng, Sách lược vắn tắt của Đảng"},{"letter":"D","text":"Sách lược vắn tắt của Đảng, Lời kêu gọi nhân dịp thành lập Đảng"}],"page":3,"correct":2},{"number":22,"question":"Điền vào chỗ trống: \"Thực tiễn không có lý luận thì dễ mắc bệnh (...)\".","options":[{"letter":"A","text":"chủ nghĩa cá nhân"},{"letter":"B","text":"chủ quan"},{"letter":"C","text":"giáo điều"},{"letter":"D","text":"tham ô"}],"page":3,"correct":1},{"number":23,"question":"Nền tảng tư tưởng của Đảng Cộng sản Việt Nam hiện nay là:","options":[{"letter":"A","text":"Chủ nghĩa Tam dân"},{"letter":"B","text":"Tư tưởng Hồ Chí Minh"},{"letter":"C","text":"Chủ nghĩa Mác - Lênin và tư tưởng Hồ Chí Minh"},{"letter":"D","text":"Chủ nghĩa Mác - Lênin"}],"page":3,"correct":2},{"number":24,"question":"Điền vào chỗ trống: \"Tư tưởng Hồ Chí Minh là kết quả của sự (...) chủ nghĩa Mác - Lênin vào điều kiện cụ thể nước ta\".","options":[{"letter":"A","text":"Kế thừa và sáng tạo"},{"letter":"B","text":"vận dụng và phát triển sáng tạo"},{"letter":"C","text":"Vận dụng và phát triển"},{"letter":"D","text":"Kế thừa và phát triển sáng tạo"}],"page":4,"correct":1},{"number":25,"question":"Phương châm nào Hồ Chí Minh nêu lên vào năm 1946 giúp người học có thể vận dụng xây dựng phong cách tư duy, phong cách diễn đạt, phong cách làm việc...","options":[{"letter":"A","text":"Lấy dân làm gốc"},{"letter":"B","text":"Gốc có vững cây mới bền"},{"letter":"C","text":"Dĩ bất biến ứng vạn biến"},{"letter":"D","text":"Chở thuyền cũng là dân, lật thuyền cũng là dân"}],"page":4,"correct":2},{"number":26,"question":"Hai bản Hiến pháp nào của Việt Nam khẳng định: \"Lấy chủ nghĩa Mác - Lênin, tư tưởng Hồ Chí Minh làm nền tảng tư tưởng và kim chỉ ":[{"letter":"A","text":"Lực lượng chính trị"},{"letter":"B","text":"Lực lượng vũ trang"},{"letter":"C","text":"Lực lượng vật chất"},{"letter":"D","text":"Lực lượng tinh thần"}],"page":2,"correct":2},{"number":13,"question":"Giá trị xuyên suốt của dân tộc Việt Nam, đặc biệt \"mỗi khi Tổ quốc bị xâm lăng thì tinh thần ấy lại trỗi dậy\" là gì?","options":[{"letter":"A","text":"Uống nước nhớ nguồn"},{"letter":"B","text":"Tôn sư trọng đạo"},{"letter":"C","text":"Tinh thần vị tha, nhân ái"},{"letter":"D","text":"Chủ nghĩa yêu nước"}],"page":2,"correct":3},{"number":14,"question":"Mục tiêu chung của phong trào yêu nước theo khuynh hướng phong kiến, dân chủ tư sản là:","options":[{"letter":"A","text":"Giành lại quyền con người"},{"letter":"B","text":"Giành độc lập cho dân tộc"},{"letter":"C","text":"Xây dựng nhà nước tư sản"},{"letter":"D","text":"Xây dựng chế độ phong kiến"}],"page":2,"correct":1},{"number":15,"question":"Ai là người được Nguyễn Ái Quốc nhận xét: \"Đưa hổ cửa trước rước beo cửa sau\"?","options":[{"letter":"A","text":"Phan Bội Châu"},{"letter":"B","text":"Phan Đình Phùng"},{"letter":"C","text":"Phan Châu Trinh"},{"letter":"D","text":"Phan Đình Giót"}],"page":2,"correct":0},{"number":16,"question":"Ở miền Bắc Việt Nam, nửa cuối thế kỷ XIX, đầu thế kỷ XX có các cuộc khởi nghĩa do những ai lãnh đạo?","options":[{"letter":"A","text":"Nguyễn Thiện Thuật, Nguyễn Trung Trực..."},{"letter":"B","text":"Nguyễn Thiện Thuật, Hoàng Hoa Thám..."},{"letter":"C","text":"Nguyễn Thiện Thuật, Phan Đình Phùng..."},{"letter":"D","text":"Nguyễn Thiện Thuật, Đặng Như Mai..."}],"page":2,"correct":1},{"number":17,"question":"Cuộc khởi nghĩa do ai lãnh đạo chấm dứt vai trò lãnh đạo của giai cấp phong kiến?","options":[{"letter":"A","text":"Phan Đình Phùng"},{"letter":"B","text":"Phan Văn Trường"},{"letter":"C","text":"Phan Bội Châu"},{"letter":"D","text":"Phan Châu Trinh"}],"page":3,"correct":0},{"number":18,"question":"Ai đưa ra nhận định: \"Luận cương của Lênin về vấn đề dân tộc òng danh lợi"},{"letter":"C","text":"Tư tưởng dân vi quý, xã tắc thứ chi"},{"letter":"D","text":"Tư tưởng trung với nước, hiếu với dân"}],"page":3,"correct":1},{"number":24,"question":"Hồ Chí Minh tiếp thu tư tưởng nào của Tuyên ngôn độc lập Mỹ?","options":[{"letter":"A","text":"Tự do, bình đẳng, bác ái"},{"letter":"B","text":"Quyền sống, quyền tự do, quyền mưu cầu hạnh phúc"},{"letter":"C","text":"Thương người như thể thương thân"},{"letter":"D","text":"Tư tưởng vị tha, từ bi, bác ái"}],"page":3,"correct":1},{"number":25,"question":"Ở miền Trung Việt Nam, nửa cuối thế kỷ XIX, có các cuộc khởi nghĩa do những ai lãnh đạo?","options":[{"letter":"A","text":"Trần Tấn, Phan Đình Phùng..."},{"letter":"B","text":"Trần Tấn, Nguyễn Quang Bích..."},{"letter":"C","text":"Trần Tấn, Nguyễn Thiện Thuật..."},{"letter":"D","text":"Trần Tấn, Nguyễn Trung Trực..."}],"page":4,"correct":0},{"number":26,"question":"Hồ Chí Minh tiếp thu tư tưởng của Khổng Tử vì:","options":[{"letter":"A","text":"Là tư sản, nhưng có những điều hay để học"},{"letter":"B","text":"Bênh vực những người bóc lột"},{"letter":"C","text":"Làm xã hội không thay đổi"},{"letter":"D","text":"Là phong kiến, nhưng có những điều hay để học"}],"page":4,"correct":3},{"number":27,"question":"Phong trào công nhân các nước tư bản và phong trào đấu tranh giải phóng dân tộc ở các nước thuộc địa có quan hệ mật thiết là do sự kiện nào tác động?","options":[{"letter":"A","text":"Đảng Cộng sản Việt Nam ra đời"},{"letter":"B","text":"Quốc tế II thành lập"},{"letter":"C","text":"Đảng cộng sản Mỹ ra đời"},{"letter":"D","text":"Quốc tế Cộng sản (Quốc tế III) thành lập"}],"page":4,"correct":3},{"number":28,"question":"Chủ nghĩa Tam dân của Tôn Trung Sơn có nội dung cơ bản là:","options":[{"letter":"A","text":"Khai dân trí, chấn dân khí, hậu dân sinh"},{"letter":"B","text":"Liên Nga, thân Cộng, phù trợ công nông"},{"letter":"C","text":"Dân tộc độc lập, dân quyền tự do, dân sinh hạnh phúc"},{"letter":"D","text":"Khai dân chí, chấn dân khí ,"text":"Các tổ chức chính trị -- xã hội có nhiệm vụ chủ yếu là đại diện và bảo vệ quyền, lợi ích hợp pháp, chính đáng của các thành viên trong tổ chức"},{"letter":"B","text":"Các tổ chức chính trị -- xã hội hoạt động nhằm tập hợp quần chúng, nhưng không trực tiếp tham gia vào quá trình xây dựng và phát triển xã hội mới"},{"letter":"C","text":"Các tổ chức chính trị -- xã hội đều nhất quán về chính trị và tư tưởng dưới sự lãnh đạo của Đảng, quản lý của Nhà nước"},{"letter":"D","text":"Các tổ chức chính trị -- xã hội phát huy tính tự chủ của từng tổ chức, không nhất thiết phải thống nhất về chính trị và tư tưởng trong quá trình hoạt động"}],"page":4,"correct":2},{"number":27,"question":"Điểm tích cực của chủ nghĩa xã hội so với các chế độ khác trong lịch sử là:","options":[{"letter":"A","text":"Giải phóng giai cấp triệt để"},{"letter":"B","text":"Giải phóng con người toàn diện"},{"letter":"C","text":"Giải phóng nhân dân"},{"letter":"D","text":"Giải phóng dân tộc"}],"page":4,"correct":1},{"number":28,"question":"Vận dụng tư tưởng Hồ Chí Minh về thời kỳ quá độ lên chủ nghĩa xã hội, khi phân biệt giữa nhiệm vụ chung và những nhiệm vụ cụ thể, nhận định nào sau đây phản ánh đúng nhiệm vụ chung của thời kỳ quá độ?","options":[{"letter":"A","text":"Phải thay đổi triệt để những quan hệ cũ đã trở thành thói quen trong lối sống, nếp sống của con người"},{"letter":"B","text":"Cải tạo nền kinh tế cũ, xây dựng nền kinh tế mới với công nghiệp và nông nghiệp ngày càng hiện đại"},{"letter":"C","text":"Xây dựng và củng cố chế độ dân chủ, bảo đảm quyền làm chủ của nhân dân dưới sự lãnh đạo của Đảng Cộng sản"},{"letter":"D","text":"Xây dựng nền văn hóa mới, phát triển con người mới và nâng cao đời sống vật chất, tinh thần của nhân dân"}],"page":4,"correct":0},{"number":29,"question":"Vận dụng tư tưởng Hồ Chí Minh về các nhiệm vụ của thời kỳ quá độ lên chủ nghĩa xã hội ở Việt Nam, khi xem xét yêu cầu cải biến các quan hệ xã hội và xây dựng đời sống xã hội mới, luận điểm nào sau đây phù h ải cải tạo những quan hệ sản xuất cũ, đồng thời xây dựng quan hệ sản xuất mới phù hợp với sự phát triển của lực lượng sản xuất"},{"letter":"C","text":"Phải triệt để tẩy trừ mọi di tích thuộc địa và ảnh hưởng nô dịch của văn hóa đế quốc"},{"letter":"D","text":"Phải phát triển lực lượng sản xuất, từng bước xây dựng cơ sở vật chất và kỹ thuật cho chủ nghĩa xã hội"}],"page":6,"correct":2},{"number":45,"question":"Theo Hồ Chí Minh, sức mạnh tổng hợp trong xây dựng chủ nghĩa xã hội là gì?","options":[{"letter":"A","text":"Sự lãnh đạo của Đảng"},{"letter":"B","text":"Đại đoàn kết toàn dân"},{"letter":"C","text":"Kết hợp sức mạnh dân tộc và chủ nghĩa yêu nước"},{"letter":"D","text":"Kết hợp sức mạnh dân tộc và thời đại"}],"page":6,"correct":3},{"number":46,"question":"Nhiệm vụ quan trọng nhất về chính trị trong thời kỳ quá độ lên chủ nghĩa xã hội là:","options":[{"letter":"A","text":"Giữ vững, phát huy vai trò lãnh đạo của Đảng"},{"letter":"B","text":"Giữ vững, phát huy vai trò của các tổ chức chính tri xã hội"},{"letter":"C","text":"Giữ vững, phát huy vai trò của Mặt trận Tổ quốc Việt Nam"},{"letter":"D","text":"Giữ vững sự đoàn kết quốc tế"}],"page":7,"correct":0},{"number":47,"question":"Biện pháp cơ bản trong xây dựng chủ nghĩa xã hội là:","options":[{"letter":"A","text":"Phát huy tinh thần dân tộc chân chính"},{"letter":"B","text":"Đem của dân, sức dân, tài dân làm lợi cho dân"},{"letter":"C","text":"Đem sức ta mà tự giải phóng cho ta"},{"letter":"D","text":"Phát huy sức mạnh khối đại đoàn kết toàn dân tộc"}],"page":7,"correct":1},{"number":48,"question":"Theo Hồ Chí Minh, đặc trưng về kinh tế của xã hội xã hội chủ nghĩa là:","options":[{"letter":"A","text":"Con người được tôn trọng, được bảo đảm đối xử công bằng, bình đẳng và các dân tộc đoàn kết, gắn bó với nhau"},{"letter":"B","text":"Tiền đề để tiến tới chế độ xã hội hòa bình, đoàn kết, ấm no, tự do, hạnh phúc, bình đẳng, bác ái"},{"letter":"C","text":"Xã hội không còn hiện tượng người bóc lột người"},{"letter":"D","text":"Xã hội có nền kinh tế phát triển cao dựa trên lực lượng sản xuất hiện đại và chế độ công hữu về tư liệu sản xuất chủ yếu"}],"page":7,"correct":3},{"number":49,"question":"Người đầu tiên chủ trương phát triển kinh tế nhiều thành phần ở Việt Nam là ai?","options":[{"letter":"A","text":"Trường Chinh"},{"letter":"B","text":"Đỗ Mười"},{"letter":"C","text":"Hồ Chí Minh"},{"letter":"D","text":"Kim Ngọc"}],"page":7,"correct":2},{"number":50,"question":"Nhiệm vụ trọng tâm của thời kỳ quá độ lên chủ nghĩa xã hội là:","options":[{"letter":"A","text":"Công nghiệp hóa xã hội chủ nghĩa"},{"letter":"B","text":"Ưu tiên phát triển nông nghiệp"},{"letter":"C","text":"Chống chủ nghĩa cá nhân"},{"letter":"D","text":"Nâng cao dân trí cho người dân"}],"page":7,"correct":0},{"number":51,"question":"Để phát huy các động lực của chủ nghĩa xã hội phải có sự thống nhất giữa:","options":[{"letter":"A","text":"Vật chất và tinh thần, văn hóa và chính trị"},{"letter":"B","text":"Vật chất và tinh thần, nội sinh và ngoại sinh"},{"letter":"C","text":"Vật chất và tinh thần, kinh tế và chính trị"},{"letter":"D","text":"Vật chất và tinh thần, giáo dục và đào tạo"}],"page":7,"correct":1},{"number":52,"question":"Thực chất của thời kỳ quá độ lên chủ nghĩa xã hội ở Việt Nam là gì?","options":[{"letter":"A","text":"Cải biến từ nền kinh tế hàng hóa sang kinh tế thị trường"},{"letter":"B","text":"Cải biến nền sản xuất lạc hậu thành nền sản xuất tiên tiến"},{"letter":"C","text":"Cải biến từ cách mạng tư sản sang cách mạng xã hội chủ nghĩa"},{"letter":"D","text":"Cải biến lao động thủ công sang sử dụng máy móc"}],"page":7,"correct":1},{"number":53,"question":"Trong thời kỳ quá độ lên chủ nghĩa xã hội ở Việt Nam, vận dụng tư tưởng Hồ Chí Minh về nhiệm vụ của thời kỳ quá độ, nội dung nào sau đây thể hiện yêu cầu nhiệm vụ trọng tâm trên lĩnh vực kinh tế?","options":[{"letter":"A","text":"Phải cải tạo nền kinh tế cũ, xây dựng nền kinh tế mới có công và nông nghiệp hiện đại"},{"letter":"B","text":"Phải xây dựng đời sống văn hóa mới, xóa bỏ những ảnh hưởng tiêu cực của văn hóa cũ và tiếp thu tinh hoa văn hóa nhân loại"},{"letter":"C","text":"Phải xây dựng và củng cố chế độ dân chủ, bảo đảm quyền làm chủ của nhân dân"},{"letter":"D","text":"Phải thay đổi triệt để những quan hệ cũ đã trở thành thói quen trong lối sống, nếp sống của con người"}],"page":7,"correct":0},{"number":54,"question":"Đặc điểm lớn nhất của Việt Nam trong thời kỳ quá độ lên chủ nghĩa xã hội là gì?","options":[{"letter":"A","text":"Từ một nước công nghiệp tiến thẳng lên chủ nghĩa xã hội"},{"letter":"B","text":"Từ một nước tư bản tiến thẳng lên con đường xã hội chủ nghĩa"},{"letter":"C","text":"Từ một nước nông nghiệp tiến lên chủ nghĩa xã hội không kinh qua chủ nghĩa từ bản"},{"letter":"D","text":"Từ một nước đang phát triển tiến thẳng lên chủ nghĩa xã hội"}],"page":8,"correct":2},{"number":55,"question":"Nhiệm vụ quan trọng hàng đầu của văn hóa xã hội chủ nghĩa là gì?","options":[{"letter":"A","text":"Đào tạo con người"},{"letter":"B","text":"Phát triển kinh tế"},{"letter":"C","text":"Phát triển giáo dục"},{"letter":"D","text":"Đào tạo đội ngũ trí thức"}],"page":8,"correct":0},{"number":56,"question":"Tiêu chí khẳng định tính lý luận và thực tiễn của chủ nghĩa xã hội là:","options":[{"letter":"A","text":"Mục tiêu nâng cao đời sống nhân dân"},{"letter":"B","text":"Mục tiêu xây dựng văn hóa tiên tiến"},{"letter":"C","text":"Mục tiêu phát triển kinh tế"},{"letter":"D","text":"Mục tiêu xây dựng xã hội dân sự"}],"page":8,"correct":0},{"number":57,"question":"Hồ Chí Minh tiếp thu, vận dụng học thuyết nào của chủ nghĩa Mác - Lênin về chủ nghĩa xã hội?","options":[{"letter":"A","text":"Tế bào"},{"letter":"B","text":"Giá trị thặng dư"},{"letter":"C","text":"Tiến hóa"},{"letter":"D","text":"Hình thái kinh tế - xã hội"}],"page":8,"correct":3},{"number":58,"question":"Vận dụng tư tưởng Hồ Chí Minh về chủ thể xây dựng chủ nghĩa xã hội, hãy xác định nhận định nào sau đây thể hiện đúng nhất vai trò của nhân dân?","options":[{"letter":"A","text":"Đội ngũ cán bộ, đảng viên là lực lượng chủ yếu quyết định kết quả của sự nghiệp xây dựng chủ nghĩa xã hội"},{"letter":"B","text":"Đảng Cộng sản là lực lượng trực tiếp thực hiện mọi nhiệm vụ trong quá trình xây dựng chủ nghĩa xã hội"},{"letter":"C","text":"Nhà nước là lực lượng giữ vai trò quyết định trong việc tổ chức và thực hiện toàn bộ quá trình xây dựng chủ nghĩa xã hội"},{"letter":"D","text":"Chính nhân dân là chủ thể, là lực lượng quyết định tốc độ xây dựng và sự vững mạnh của chủ nghĩa xã hội"}],"page":8,"correct":3},{"number":59,"question":"Theo Hồ Chí Minh, nền kinh tế xã hội chủ nghĩa phải được tạo lập trên cơ sở:","options":[{"letter":"A","text":"Khoa học công nghệ tiên tiến"},{"letter":"B","text":"Chế độ công hữu về tư liệu sản xuất"},{"letter":"C","text":"Chế độ tư hữu về tư liệu sản xuất"},{"letter":"D","text":"Chế độ đa sở hữu"}],"page":8,"correct":1},{"number":60,"question":"Mục tiêu cao nhất của chủ nghĩa xã hội theo Hồ Chí Minh là:","options":[{"letter":"A","text":"Nâng cao đời sống tinh thần"},{"letter":"B","text":"Nâng cao thu nhập bình quân theo đầu người"},{"letter":"C","text":"Nâng cao dân trí cho nhân dân"},{"letter":"D","text":"Nâng cao đời sống nhân dân"}],"page":8,"correct":3}],"chapter":3,"nav":"Mục II","eyebrow":"CHƯƠNG 3 · MỤC II","subtitle":"Chủ nghĩa xã hội và thời kỳ quá độ"},{"id":"chapter4_1","title":"Chương 4 - Bổ sung (Phần 1)","questions":[{"number":1,"question":"Chọn đáp án đúng để hoàn thành câu sau: \"Trong quá trình hiện thực hoá hệ thống quan điểm của Hồ Chí Minh, cách mạng Việt Nam luôn (...) sáng tạo hệ thống quan điểm đó trong những điều kiện mới\".","options":[{"letter":"A","text":"vận dụng và phát triển."},{"letter":"B","text":"vận dụng sáng tạo."},{"letter":"C","text":"sáng tạo linh hoạt."},{"letter":"D","text":"có cơ sở lý luận hình thành."}],"page":1,"correct":0},{"number":2,"question":"Tại Khoá họp Đại hội đồng lần thứ 24 ở Paris (năm 1987), tổ chức nào đã \"ghi nhận năm 1990 sẽ đánh dấu 100 năm kỷ niệm Ngày sinh của Chủ tịch Hồ Chí Minh, Anh hùng giải phóng dân tộc và Nhà văn hoá kiệt xuất của Việt Nam\"?","options":[{"letter":"A","text":"Hội đồng Kinh tế và Xã hội (ECOSOC)."},{"letter":"B","text":"Tổ chức Giáo dục, Khoa học và Văn hoá của Liên Hợp Quốc (UNESCO)."},{"letter":"C","text":"Hiệp hội các quốc gia Đông Nam Á (ASEAN)."},{"letter":"D","text":"Quỹ Nhi đồng Liên Hợp Quốc (UNICEF)."}],"page":1,"correct":1},{"number":3,"question":"Chọn đáp án đúng và điền vào chỗ trống: Đại hội II của Đảng (tháng 2/1951) nêu rõ: \"Toàn Đảng hãy ra sức học tập đường lối chính trị, tác phong và đạo đức cách mạng của Hồ chủ tịch; sự học tập ấy, là (...) làm cho Đảng mạnh và làm cho cách mạng đi mau đến thắng lợi hoàn toàn\".","options":[{"letter":"A","text":"điều kiện tiên quyết."},{"letter":"B","text":"động lực mạnh mẽ."},{"letter":"C","text":"niềm tin to lớn."},{"letter":"D","text":"cơ sở lý luận."}],"page":1,"correct":0},{"number":4,"question":"Hệ thống quan điểm toàn diện và sâu sắc của Hồ Chí Minh về những vấn đề cơ bản của cách mạng Việt Nam được phản ánh:","options":[{"letter":"A","text":"trong các tạp chí và trong cuộc đời hoạt động cách mạng của Người."},{"letter":"B","text":"trong các bài viết, tạp chí, sách báo và nội dung Cương lĩnh chính trị đầu tiên."},{"letter":"C","text":"trong những bài nói, bài viết, hoạt động cách mạng và cuộc sống hằng ngày của Người."},{"letter":"D","text":"trong lý luận và thực tiễn cách mạng Việt Nam."}],"page":1,"correct":2},{"number":5,"question":"Nội dung tư tưởng của Hồ Chí Minh về đại đoàn kết toàn dân tộc, hãy xác định: Vấn đề mang tính chất sống còn của dân tộc Việt Nam, được duy trì cả trong cách mạng dân tộc dân chủ nhân dân và cách mạng xã hội chủ nghĩa là gì?","options":[{"letter":"A","text":"Xây dựng khối liên minh công - nông - trí đặt dưới sự lãnh đạo của Đảng."},{"letter":"B","text":"Kết hợp sức mạnh dân tộc với sức mạnh thời đại trong điều kiện mới."},{"letter":"C","text":"Đoàn kết quốc tế."},{"letter":"D","text":"Đại đoàn kết toàn dân tộc."}],"page":1,"correct":3},{"number":6,"question":"Học đi đôi với hành, nói đi đôi với làm. Đây là sự vận dụng phương pháp luận nào trong nghiên cứu tư tưởng Hồ Chí Minh?","options":[{"letter":"A","text":"Tính thống nhất lý luận và thực tiễn."},{"letter":"B","text":"Quan điểm lịch sử - cụ thể."},{"letter":"C","text":"Thống nhất tính đảng và tính khoa học."},{"letter":"D","text":"Quan điểm kế thừa và phát triển."}],"page":1,"correct":0},{"number":7,"question":"Đầu thế kỷ XX, chịu tác động xu hướng vận động cải cách của Trung Quốc và Nhật Bản, ở Việt Nam xuất hiện các phong trào yêu nước theo khuynh hướng dân chủ tư sản nào?","options":[{"letter":"A","text":"Đông Du, Duy Tân, Yên Thế, Cần Vương."},{"letter":"B","text":"Đông Du, Duy Tân, Đông Kinh Nghĩa Thục, Chống đi phu, Chống sưu thuế."},{"letter":"C","text":"Đông Kinh Nghĩa Thục, Chống đi phu, chống sưu thuế, Yên Thế."},{"letter":"D","text":"Đông Du, Duy Tân, Đông Kinh Nghĩa Thục, Cần Vương."}],"page":1,"correct":1},{"number":8,"question":"Phong trào Đông Kinh Nghĩa Thục (tháng 3 đến tháng 11 năm 1907) do ai khởi xướng?","options":[{"letter":"A","text":"Phan Châu Trinh, Nguyễn Thái Học."},{"letter":"B","text":"Phan Bội Châu, Lương Văn Can."},{"letter":"C","text":"Nguyễn Thái Học, Nguyễn Quyền."},{"letter":"D","text":"Lương Văn Can, Nguyễn Quyền."}],"page":1,"correct":3},{"number":9,"question":"Theo Hồ Chí Minh, tổ chức chính trị nào theo đuổi lý tưởng của cuộc Đại cách mạng Pháp: \"Tự do - Bình đẳng - Bác ái\"?","options":[{"letter":"A","text":"Đảng Cộng sản Pháp."},{"letter":"B","text":"Đảng Xã hội Pháp."},{"letter":"C","text":"Đảng Cộng sản Việt Nam."},{"letter":"D","text":"Đảng Dân chủ Mỹ."}],"page":1,"correct":1},{"number":10,"question":"Năm 1921, Hồ Chí Minh thành lập tổ chức nào?","options":[{"letter":"A","text":"Hội Liên hiệp thuộc địa."},{"letter":"B","text":"Hội Ái hữu."},{"letter":"C","text":"Mặt trận Việt Minh."},{"letter":"D","text":"Việt Nam Quang Phục hội."}],"page":1,"correct":0},{"number":11,"question":"Tổ chức nào ra đời ở Trung Quốc vào năm 1925 và được coi là tiền thân của Đảng Cộng sản Việt Nam?","options":[{"letter":"A","text":"Hội kín Nam Kỳ."},{"letter":"B","text":"Hội Liên hiệp sinh viên Việt Nam."},{"letter":"C","text":"Hội Liên hiệp các dân tộc bị áp bức ở Á Đông."},{"letter":"D","text":"Hội Việt Nam Cách mạng Thanh niên."}],"page":1,"correct":3},{"number":12,"question":"Tờ báo nào được xuất bản năm 1925, viết bằng tiếng Việt, đã đưa chủ nghĩa Mác - Lênin và lý luận cách mạng đến với các tổ chức yêu nước và công nhân một cách có hệ thống?","options":[{"letter":"A","text":"Nhân đạo."},{"letter":"B","text":"Đời sống công nhân."},{"letter":"C","text":"Thanh niên."},{"letter":"D","text":"Búa liềm."}],"page":1,"correct":2},{"number":13,"question":"Tác phẩm nào của Hồ Chí Minh xuất bản tại Quảng Châu, Trung Quốc đề cập đến những vấn đề cơ bản về đường lối, phương pháp cách mạng Việt Nam?","options":[{"letter":"A","text":"Đời sống mới (1947)."},{"letter":"B","text":"Con đường cứu nước và giải phóng dân tộc trong thời đại ngày nay (1959)."},{"letter":"C","text":"Đường cách mệnh (1927)."},{"letter":"D","text":"Lịch sử nước ta (1942)."}],"page":1,"correct":2},{"number":14,"question":"Tháng 01/1941, Hồ Chí Minh về nước tại địa điểm nào?","options":[{"letter":"A","text":"Đông Anh, Hà Nội."},{"letter":"B","text":"Pác Bó, Cao Bằng."},{"letter":"C","text":"Ma Cao, Trung Quốc."},{"letter":"D","text":"Quảng Châu, Trung Quốc."}],"page":1,"correct":1},{"number":15,"question":"Tác phẩm nào của Hồ Chí Minh phản ánh rõ ràng đường lối kháng chiến chống thực dân Pháp của Đảng?","options":[{"letter":"A","text":"Lời kêu gọi toàn quốc kháng chiến (1946)."},{"letter":"B","text":"Tuyên ngôn độc lập (1945)."},{"letter":"C","text":"Lời kêu gọi đồng bào và chiến sĩ cả nước (1966)."},{"letter":"D","text":"Di chúc (1969)."}],"page":1,"correct":0},{"number":16,"question":"Tác phẩm nào của Hồ Chí Minh nêu lên chân lý lớn của thời đại: \"Không có gì quý hơn độc lập, tự do\"?","options":[{"letter":"A","text":"Lời kêu gọi toàn quốc kháng chiến (1946)."},{"letter":"B","text":"Tuyên ngôn độc lập (1945)."},{"letter":"C","text":"Lời kêu gọi đồng bào và chiến sĩ cả nước (1966)."},{"letter":"D","text":"Di chúc (1969)."}],"page":1,"correct":2},{"number":17,"question":"Luận điểm \"Chủ trương làm tư sản dân quyền cách mạng và thổ địa cách mạng để đi tới xã hội cộng sản\" được viết trong tác phẩm nào của Hồ Chí Minh?","options":[{"letter":"A","text":"Đường cách mệnh (1927)."},{"letter":"B","text":"Lênin và các dân tộc thuộc địa (1924)."},{"letter":"C","text":"Cách xem xét việc đời và cách tu dưỡng của người cách mạng (1949)."},{"letter":"D","text":"Chánh cương vắn tắt của Đảng (1930)."}],"page":1,"correct":3},{"number":18,"question":"Luận điểm: \"Tất cả các dân tộc trên thế giới đều sinh ra bình đẳng, dân tộc nào cũng có quyền sống, quyền sung sướng và quyền tự do\" của Hồ Chí Minh được nêu trong tác phẩm nào?","options":[{"letter":"A","text":"Tuyên ngôn độc lập (1945)."},{"letter":"B","text":"Đạo đức lao động (1952)."},{"letter":"C","text":"Khổng Tử (1926)."},{"letter":"D","text":"Đảng ta (1949)."}],"page":1,"correct":0},{"number":19,"question":"Vận dụng nội dung quan niệm của Hồ Chí Minh trong bối cảnh hiện nay về độc lập dân tộc, Đảng cần tập trung vào những biện pháp cụ thể nào?","options":[{"letter":"A","text":"Đẩy mạnh hội nhập kinh tế quốc tế, thực hiện đa dạng hóa các quan hệ quốc tế."},{"letter":"B","text":"Xây dựng Đảng trong sạch, vững mạnh, thực hiện tốt các nghị quyết của Đảng."},{"letter":"C","text":"Mở rộng hợp tác quốc tế trong lĩnh vực giáo dục và y tế."},{"letter":"D","text":"Thúc đẩy các chương trình phát triển kinh tế vùng nông thôn."}],"page":1,"correct":1},{"number":20,"question":"\"Hễ là người Việt Nam thì phải đứng lên đánh thực dân Pháp để cứu Tổ quốc\" là câu nói được Hồ Chí Minh khẳng định trong tác phẩm nào?","options":[{"letter":"A","text":"Củng cố và phát triển sự thống nhất tư tưởng của các từ hoặc cụm từ để điền vào chỗ trống: \"Toàn thể dân Việt Nam quyết đem (...) để giữ vững quyền tự do và độc lập ấy\".","options":[{"letter":"A","text":"toàn bộ con người."},{"letter":"B","text":"tất cả lực lượng tinh thần và lực lượng vật chất."},{"letter":"C","text":"tất cả tinh thần và lực lượng, tính mệnh và của cải."},{"letter":"D","text":"nguồn nhân lực sẵn có."}],"page":1,"correct":2},{"number":37,"question":"Chọn đáp án đúng hoàn thành câu nói: \"Chủ tịch Hồ Chí Minh ngày nay là (...) của cách mạng xã hội chủ nghĩa, của các dân tộc thuộc địa và phụ thuộc, đang chỉ đường cho chúng ta bằng ánh sáng của chủ nghĩa Mác - Lênin\".","options":[{"letter":"A","text":"ngôi sao trên bầu trời."},{"letter":"B","text":"nhân vật quan trọng."},{"letter":"C","text":"tấm gương sáng."},{"letter":"D","text":"lãnh tụ."}],"page":1,"correct":2},{"number":38,"question":"\"Dân tộc ta, nhân dân ta, non sông đất nước ta đã sinh ra HỒ CHỦ TỊCH, người anh hùng dân tộc vĩ đại, và chính Người đã làm rạng rỡ dân tộc ta, nhân dân ta và non sông đất nước ta\". Câu trên được trích từ văn kiện nào của Đảng?","options":[{"letter":"A","text":"Văn kiện đại hội đại biểu toàn quốc lần thứ IV của Đảng."},{"letter":"B","text":"Văn kiện đại hội đại biểu toàn quốc lần thứ V của Đảng."},{"letter":"C","text":"Điếu văn của Ban Chấp hành Trung ương Đảng Lao động Việt Nam."},{"letter":"D","text":"Văn kiện đại hội đại biểu toàn quốc lần thứ VI của Đảng."}],"page":1,"correct":2},{"number":39,"question":"Chọn cụm từ đúng để điền vào chỗ trống trong luận điểm: \"làm tư sản dân quyền cách mạng và thổ địa cách mạng để đi tới (...)\"","options":[{"letter":"A","text":"chủ nghĩa tư bản."},{"letter":"B","text":"chủ nghĩa xã hội."},{"letter":"C","text":"xã hội cộng sản."},{"letter":"D","text":"xã hội chủ nghĩa."}],"page":1,"correct":2},{"number":40,"question":"Tư tưởng nào của Tôn Trung Sơn được Nguyễn Ái Quốc đánh giá là \"phù hợp với điều kiện nước ta\"?","options":[{"letter":"A","text":"Đánh đổ phong kiến, ủng hộ dân chủ tư sản, thân Nga Xô viết."},{"letter":"B","text":"Đánh đổ phong kiến, thân Nga, Quốc - Cộng hợp tác."},{"letter":"C","text":"Dân tộc độc lập, dân quyền tự do, dân sinh hạnh phúc."},{"letter":"D","text":"Quyền phân lập, quyền tự do và dân sinh hạnh phúc."}],"page":1,"correct":2},{"number":41,"question":"Quá trình hình thành và phát triển tư tưởng Hồ Chí Minh trải qua nhiều thời kỳ, từ năm 1930 đến năm 1941 thuộc thời kỳ nào sau đây?","options":[{"letter":"A","text":"Tìm đường giải phóng dân tộc."},{"letter":"B","text":"Hình thành quan điểm toàn diện và sâu sắc về cách mạng Việt Nam."},{"letter":"C","text":"Vượt qua thử thách, giữ vững đường lối, phương pháp cách mạng Việt Nam đúng đắn, sáng tạo."},{"letter":"D","text":"Hình thành ý chí cứu nước, giải phóng dân tộc."}],"page":1,"correct":2},{"number":42,"question":"Chọn cụm từ đúng điền vào chỗ trống để hoàn thành luận điểm: \"Chủ nghĩa yêu nước sẽ biến thành (...) thực sự khi nó ăn sâu vào tiềm thức, vào ý chí và hành động của mỗi con người\".","options":[{"letter":"A","text":"giá trị vật chất."},{"letter":"B","text":"sức mạnh tài nguyên."},{"letter":"C","text":"lực lượng vật chất."},{"letter":"D","text":"nguồn lực vật chất."}],"page":1,"correct":2},{"number":43,"question":"Theo Hồ Chí Minh, chủ nghĩa Mác - Lênin có ưu điểm lớn nhất là gì?","options":[{"letter":"A","text":"Tính chất khoa học."},{"letter":"B","text":"Tinh thần đấu tranh."},{"letter":"C","text":"Tính nhân đạo toàn diện."},{"letter":"D","text":"Phương pháp làm việc biện chứng."}],"page":1,"correct":3},{"number":44,"question":"Ở Pháp, trước khi trở thành một trong những người sáng lập Đảng Cộng sản Pháp vào năm 1920, Nguyễn Ái Quốc đã gia nhập đảng chính trị nào?","options":[{"letter":"A","text":"Công đảng."},{"letter":"B","text":"Đảng Bảo thủ."},{"letter":"C","text":"Đảng Xã hội."},{"letter":"D","text":"Đảng Dân chủ Thiên Chúa giáo."}],"page":1,"correct":2},{"number":45,"question":"\"Tên tuổi của đồng chí Hồ Chí Minh sẽ mãi mãi gắn bó với những hành động cao cả nhất và những ước mơ cao quý nhất của nhân loại\". Đó là nội dung bức điện văn của:","options":[{"letter":"A","text":"R. Arixmendi - Tổng Bí thư Đảng Cộng sản Uruguay."},{"letter":"B","text":"Ủy ban toàn quốc Đảng Cộng sản Mỹ."},{"letter":"C","text":"Bumêđiên - Chủ tịch Hội đồng bộ trưởng Angiêri."},{"letter":"D","text":"Chủ tịch phong trào nhân dân giải phóng Angola."}],"page":1,"correct":1},{"number":46,"question":"Đối tượng của cách mạng ở các nước thuộc địa, theo Hồ Chí Minh là","options":[{"letter":"A","text":"chủ nghĩa thực dân và tay sai phản động."},{"letter":"B","text":"bọn phản động."},{"letter":"C","text":"địa chủ cường hào."},{"letter":"D","text":"giai cấp tư sản."}],"page":1,"correct":0},{"number":47,"question":"Theo Hồ Chí Minh, cách mạng giải phóng dân tộc muốn giành thắng lợi thì cần phải hành động như thế nào?","options":[{"letter":"A","text":"Dựa vào các quốc gia thuộc địa trên toàn cầu."},{"letter":"B","text":"Tăng trưởng kinh tế."},{"letter":"C","text":"Được tiến hành một cách chủ động, sáng tạo, có khả năng giành thắng lợi trước cách mạng vô sản ở chính quốc."},{"letter":"D","text":"Dựa vào chiến thắng của cách mạng ở các nước tư bản."}],"page":1,"correct":2},{"number":48,"question":"Chọn những cụm từ đúng điền vào chỗ trống để hoàn thành quan điểm sau: \"Độc lập dân tộc phải là một nền độc lập thật sự, hoàn toàn, gắn với (...), thống nhất (...) của đất nước\"?","options":[{"letter":"A","text":"hòa bình - giữ vững lãnh thổ."},{"letter":"B","text":"hòa bình - toàn vẹn lãnh thổ."},{"letter":"C","text":"hòa bình - phát triển."},{"letter":"D","text":"hòa bình - giàu đẹp."}],"page":1,"correct":1},{"number":49,"question":"Tháng 5/1941, tại Cao Bằng, Hồ Chí Minh chủ trì Hội nghị lần thứ tám của Ban Chấp hành Trung ương Đảng đã quyết định \"thay đổi chiến lược\" cách mạng như thế nào?","options":[{"letter":"A","text":"Chuyển từ đấu tranh giai cấp sang đấu tranh giải phóng loài người."},{"letter":"B","text":"Giải phóng con người để hướng tới giải phóng dân tộc."},{"letter":"C","text":"Chuyển từ đấu tranh giai cấp sang đấu tranh giải phóng dân tộc."},{"letter":"D","text":"Loại bỏ chế độ sở hữu tư nhân, sự áp bức và bóc lột nói chung."}],"page":1,"correct":2},{"number":50,"question":"Theo Hồ Chí Minh, nền văn hóa Việt Nam có những tính chất nào?","options":[{"letter":"A","text":"Dân tộc, khoa học, đại chúng."},{"letter":"B","text":"Dân tộc, đại chúng, nhân văn."},{"letter":"C","text":"Khoa học, quần chúng, tiến bộ."},{"letter":"D","text":"Khoa học, đại chúng, chọn lọc."}],"page":1,"correct":0},{"number":51,"question":"Mục tiêu đầu tiên của cách mạng, là cơ sở, tiền đề cho mục tiêu xây dựng chủ nghĩa xã hội và chủ nghĩa cộng sản theo Hồ Chí Minh là gì?","options":[{"letter":"A","text":"Giải phóng giai cấp, giành ruộng đất cho dân cày."},{"letter":"B","text":"Giải phóng xã hội, giành quyền tự do, dân chủ."},{"letter":"C","text":"Giải phóng dân tộc, giành độc lập dân tộc."},{"letter":"D","text":"Giải phóng con người, giành quyền bình đẳng."}],"page":1,"correct":2},{"number":52,"question":"Ngày 17/7/1966, trong Lời kêu gọi đồng bào và chiến sĩ cả nước, Hồ Chí Minh đã nêu cao chân lý gì?","options":[{"letter":"A","text":"\"Đoàn kết tất cả các lực lượng tiến bộ trên thế giới\""},{"letter":"B","text":"\"Không có gì quý hơn độc lập tự do\""},{"letter":"C","text":"\"Liên hiệp các dân tộc bị áp bức và các nước vô sản đoàn kết lại\""},{"letter":"D","text":"\"Thà hy sinh tất cả, chứ nhất định không để mất nước\""}],"page":1,"correct":1},{"number":53,"question":"Trong Chánh cương vắn tắt của Đảng, Hồ Chí Minh nêu rõ: Cách mạng tư sản dân quyền trước hết phải đánh đổ lực lượng nào?","options":[{"letter":"A","text":"Phát xít Nhật."},{"letter":"B","text":"Đế quốc và bọn phản động thuộc địa."},{"letter":"C","text":"Bọn phản động thuộc địa và tay sai của chúng."},{"letter":"D","text":"Đế quốc chủ nghĩa Pháp và bọn phong kiến."}],"page":1,"correct":3},{"number":54,"question":"Liên hệ nội dung Đại hội lần thứ XI của Đảng, hãy xác định một trong những bài học kinh nghiệm rút ra trong quá trình xây dựng chủ nghĩa xã hội ở Việt Nam là phải nắm vững \"ngọn cờ\" gì?","options":[{"letter":"A","text":"Dân chủ, tiến bộ và công bằng xã hội."},{"letter":"B","text":"Độc lập, dân giàu, dân chủ, công bằng, nước mạnh, văn minh."},{"letter":"C","text":"Hòa bình, dân chủ và chủ nghĩa xã hội."},{"letter":"D","text":"Độc lập dân tộc và chủ nghĩa xã hội."}],"page":1,"correct":3},{"number":55,"question":"Chọn đáp án đúng điền vào chỗ trống để hoàn thành luận điểm của Hồ Chí Minh trích trong Chánh cương vắn tắt của Đảng (1930): \"Chủ trương làm tư sản dân quyền cách mạng và thổ địa cách mạng để đi tới (...)\"","options":[{"letter":"A","text":"chủ nghĩa xã hội."},{"letter":"B","text":"xã hội cộng sản."},{"letter":"C","text":"độc lập dân tộc."},{"letter":"D","text":"giải phóng dân tộc."}],"page":1,"correct":1},{"number":56,"question":"Đang Cộng sản Việt Nam ra đời đã được toàn dân tộc trao cho sứ mệnh nào sau đây?","options":[{"letter":"A","text":"Lãnh đạo đất nước trong sự nghiệp giải phóng dân tộc và đi lên chủ nghĩa xã hội."},{"letter":"B","text":"Lãnh đạo đất nước đi lên chủ nghĩa xã hội ở miền Bắc và đấu tranh giải phóng miền Nam."},{"letter":"C","text":"Lãnh đạo cả nước đi lên chủ nghĩa xã hội và lãnh đạo công cuộc đổi mới."},{"letter":"D","text":"Lãnh đạo đất nước đấu tranh giành chính quyền cách mạng."}],"page":1,"correct":0},{"number":57,"question":"Khi đánh giá về Cách mạng tư sản Mỹ năm 1776 và Cách mạng tư sản Pháp năm 1789, Hồ Chí Minh cho rằng: Các cuộc cách mạng này là những cuộc cách mạng","options":[{"letter":"A","text":"không đạt được kết quả."},{"letter":"B","text":"chưa hoàn chỉnh."},{"letter":"C","text":"thành công đến nơi."},{"letter":"D","text":"không đến nơi."}],"page":1,"correct":3},{"number":58,"question":"Nét đặc sắc trong tư tưởng Hồ Chí Minh về hình thái bạo lực cách mạng là gì?","options":[{"letter":"A","text":"Khởi nghĩa chủ yếu dựa vào lực lượng quân đội chính quy."},{"letter":"B","text":"Đấu tranh kinh tế và đấu tranh văn hóa để giành thắng lợi cho cách mạng."},{"letter":"C","text":"Lực lượng tham gia cách mạng là liên minh công - nông - trí thức."},{"letter":"D","text":"Toàn dân khởi nghĩa, toàn dân nổi dậy."}],"page":1,"correct":3},{"number":59,"question":"Trong tư tưởng Hồ Chí Minh về cách mạng giải phóng dân tộc, luận điểm nào có giá trị lý luận và thực tiễn đóng góp vào hệ thống lý luận của chủ nghĩa Mác - Lênin?","options":[{"letter":"A","text":"Phải đi theo cách mạng giải phóng dân tộc."},{"letter":"B","text":"Giải phóng giai cấp cần được tiến hành trước giải phóng dân tộc."},{"letter":"C","text":"Phải là lực lượng của toàn thể nhân dân."},{"letter":"D","text":"Cách mạng giải phóng dân tộc cần chủ động, sáng tạo, có khả năng giành thắng lợi trước cách mạng vô sản ở chính quốc."}],"page":1,"correct":3},{"number":60,"question":"Trong nhiều tác phẩm của mình, Hồ Chí Minh cho rằng các lực lượng, giai cấp như: Tư sản dân tộc, tiểu tư sản và một bộ phận địa chủ có vị trí, vai trò như thế nào trong lực lượng tham gia cách mạng?","options":[{"letter":"A","text":"Là chủ lực quân của cách mệnh."},{"letter":"B","text":"Là lực lượng duy nhất, không thể thiếu."},{"letter":"C","text":"Là bạn đồng minh của cách mạng."},{"letter":"D","text":"Là chủ, là gốc của cách mạng."}],"page":1,"correct":2}],"chapter":4,"nav":"Bổ sung · Phần 1","eyebrow":"CHƯƠNG 4 · BỔ SUNG","subtitle":"120 câu hỏi bổ sung từ bộ đề ôn tập (câu 1-60)"},{"id":"chapter4_2","title":"Chương 4 - Bổ sung (Phần 2)","questions":[{"number":1,"question":"Tháng 7/1945, tại lán Nà Nưa, Hồ Chí Minh đã đúc kết ý chí chiến đấu vì độc lập, tự do của nhân dân ta qua câu nói nào dưới đây?","options":[{"letter":"A","text":"\"Cờ treo độc lập nền xây bình quyền\"."},{"letter":"B","text":"\"Nước Việt Nam mãi mãi là một, nhất định đứng lên bảo vệ nền độc lập dân tộc, không cam chịu mất nước, không cam tâm làm nô lệ\"."},{"letter":"C","text":"\"Dù hi sinh đến đâu, dù phải đốt cháy cả dãy Trường Sơn cũng phải kiên quyết giành cho được độc lập\"."},{"letter":"D","text":"\"Không có gì quý hơn độc lập, tự do\"."}],"page":1,"correct":2},{"number":2,"question":"Năm 1919, Hồ Chí Minh gửi tới Hội nghị Versailles bản Yêu sách của nhân dân An Nam, bao gồm 8 điểm với các nội dung cơ bản, chủ yếu là gì?","options":[{"letter":"A","text":"Quyền con người và các quyền dân tộc tự quyết của người dân Đông Dương."},{"letter":"B","text":"Quyền tự do báo chí, quyền đi lại và quyền con người."},{"letter":"C","text":"Quyền tự do đi lại và các quyền hội họp, quyền dân chủ của người dân Đông Dương."},{"letter":"D","text":"Quyền bình đẳng về mặt pháp lý và các quyền tự do, dân chủ của người dân Đông Dương."}],"page":1,"correct":3},{"number":3,"question":"Trong Lời kết thúc buổi ra mắt Đảng Lao động Việt Nam, ngày 3/3/1951, Hồ Chí Minh tuyên bố mục đích của Đảng Lao động Việt Nam chỉ có thể bao gồm trong 8 chữ nào?","options":[{"letter":"A","text":"ANH HÙNG, BẤT KHUẤT, TRUNG HẬU, ĐẢM ĐANG."},{"letter":"B","text":"CẦN, KIỆM, LIÊM, CHÍNH, CHÍ COMG VÔ TƯ."},{"letter":"C","text":"ĐOÀN KẾT TOÀN DÂN, PHỤNG SỰ TỔ QUỐC."},{"letter":"D","text":"VÌ NƯỚC QUÊN THÂN, VÌ DÂN PHỤC VỤ."}],"page":1,"correct":2},{"number":4,"question":"Theo Hồ Chí Minh, đại đoàn kết toàn dân tộc phải được xác định là nhiệm vụ hàng đầu của tổ chức nào?","options":[{"letter":"A","text":"Đảng Cộng sản Việt Nam."},{"letter":"B","text":"Nhà nước Cộng hòa xã hội chủ nghĩa Việt Nam."},{"letter":"C","text":"Mặt trận Tổ quốc Việt Nam."},{"letter":"D","text":"Tổng Liên đoàn Lao động Việt Nam."}],"page":1,"correct":0},{"number":5,"question":"Mâu thuẫn chủ yếu trong xã hội thuộc địa phương Đông không thể điều hòa theo Hồ Chí Minh là mâu thuẫn giữa","options":[{"letter":"A","text":"nhân dân (chủ yếu là nông dân) với phong kiến."},{"letter":"B","text":"công nhân với tư sản."},{"letter":"C","text":"dân tộc bị áp bức với chủ nghĩa thực dân."},{"letter":"D","text":"công nhân với địa chủ phong kiến, tư sản."}],"page":1,"correct":2},{"number":6,"question":"Vận dụng tư tưởng Hồ Chí Minh về đại đoàn kết toàn dân tộc, hãy xác định: Yếu tố nào là đòi hỏi khách quan của quần chúng nhân dân trong cuộc đấu tranh tự giải phóng?","options":[{"letter":"A","text":"Đại đoàn kết."},{"letter":"B","text":"Chủ nghĩa yêu nước."},{"letter":"C","text":"Ý thức tự lực, tự cường."},{"letter":"D","text":"Tinh thần nhân ái, khoan dung."}],"page":1,"correct":0},{"number":7,"question":"Công tác vận động quần chúng được gọi là công tác gì?","options":[{"letter":"A","text":"Công vận."},{"letter":"B","text":"Dân vận."},{"letter":"C","text":"Binh vận."},{"letter":"D","text":"Trí vận."}],"page":1,"correct":1},{"number":8,"question":"Nội dung cơ bản của Cương lĩnh chính trị đầu tiên của Đảng (1930) xác định mục tiêu đầu tiên của cách mạng là gì?","options":[{"letter":"A","text":"Giải phóng dân tộc, giành độc lập dân tộc."},{"letter":"B","text":"Giải phóng giai cấp, giành độc lập dân tộc."},{"letter":"C","text":"Giải phóng con người giành độc lập, thống nhất cho dân tộc."},{"letter":"D","text":"Giải phóng dân tộc, đi lên xây dựng chủ nghĩa tư bản."}],"page":1,"correct":0},{"number":9,"question":"Vận dụng tư tưởng Hồ Chí Minh về độc lập dân tộc và chủ nghĩa xã hội trong giai đoạn hiện nay ở nước ta chúng ta cần phải làm gì?","options":[{"letter":"A","text":"Tích cực thực hiện có hiệu quả các nghị quyết của Đảng, trong đó các nghị quyết về xây dựng Đảng giữ vị trí rất quan trọng."},{"letter":"B","text":"Chỉ chú trọng xây dựng Đảng về tư tưởng."},{"letter":"C","text":"Mở rộng hợp tác quốc tế trong lĩnh vực giáo dục và y tế."},{"letter":"D","text":"Thúc đẩy các chương trình phát triển kinh tế vùng nông thôn."}],"page":1,"correct":0},{"number":10,"question":"Vận dụng tư tưởng Hồ Chí Minh Nhà nước, hãy xác định: căn bệnh nào gây ra tình trạng mất đoàn kết, gây rối cho công tác phòng, chống tiêu cực trong nhà nước?","options":[{"letter":"A","text":"\"Tư túng\", \"chia rẽ\", \"kiêu ngạo\"."},{"letter":"B","text":"Tham ô, quan liêu."},{"letter":"C","text":"Tham ô, lãng phí, quan liêu."},{"letter":"D","text":"Đặc quyền, đặc lợi."}],"page":1,"correct":0},{"number":11,"question":"Ở Việt Nam, người đầu tiên đề xuất cần phải phát triển kinh tế nhiều thành phần trong suốt thời kỳ quá độ lên chủ nghĩa xã hội là ai?","options":[{"letter":"A","text":"Nguyễn Văn Linh."},{"letter":"B","text":"Tôn Đức Thắng."},{"letter":"C","text":"Lê Duẩn."},{"letter":"D","text":"Hồ Chí Minh."}],"page":1,"correct":3},{"number":12,"question":"Theo Hồ Chí Minh, sức mạnh tổng hợp được sử dụng và phát huy trong sự nghiệp xây dựng chủ nghĩa xã hội ở Việt Nam là gì?","options":[{"letter":"A","text":"Khối đại đoàn kết của toàn dân."},{"letter":"B","text":"Thực hiện công nghiệp hóa, hiện đại hóa nhằm đưa đất nước phát triển và hướng tới nền kinh tế tri thức."},{"letter":"C","text":"Kết hợp sức mạnh dân tộc với sức mạnh thời đại."},{"letter":"D","text":"Tích cực hội nhập sâu rộng vào nền kinh tế quốc tế, đồng thời bảo vệ và phát huy bản sắc văn hóa dân tộc."}],"page":1,"correct":2},{"number":13,"question":"Theo Hồ Chí Minh, nguyên tắc phân phối chủ yếu trong chủ nghĩa xã hội là gì?","options":[{"letter":"A","text":"Phân phối theo nguồn lực vốn."},{"letter":"B","text":"Làm theo nhu cầu, hưởng theo lợi ích."},{"letter":"C","text":"Làm theo năng lực, hưởng theo lao động."},{"letter":"D","text":"Phân phối theo phúc lợi xã hội."}],"page":1,"correct":2},{"number":14,"question":"Điền vào chỗ trống để hoàn thành quan điểm sau của Hồ Chí Minh: \"Đoàn kết thực sự nghĩa là vừa đoàn kết, vừa đấu tranh, học những cái tốt của nhau, (...) những cái sai của nhau và (...) trên lập trường thân ái, vì nước, vì dân\".","options":[{"letter":"A","text":"tự phê bình - tự phê bình."},{"letter":"B","text":"phê bình - phê bình."},{"letter":"C","text":"góp ý - góp ý."},{"letter":"D","text":"chi rõ - chi rõ."}],"page":1,"correct":1},{"number":15,"question":"Giữa nội lực và ngoại lực, Hồ Chí Minh xác định ngoại lực có vai trò như thế nào đối với sự nghiệp xây dựng chủ nghĩa xã hội ở Việt Nam?","options":[{"letter":"A","text":"Rất quan trọng."},{"letter":"B","text":"Quyết định nhất."},{"letter":"C","text":"Động lực chính."},{"letter":"D","text":"Không thể thiếu."}],"page":1,"correct":0},{"number":16,"question":"Theo Hồ Chí Minh, yêu cầu cần có để đảm bảo độc lập dân tộc gắn liền với chủ nghĩa xã hội phải dựa trên nền tảng của khối liên minh nào?","options":[{"letter":"A","text":"Liên minh châu Âu."},{"letter":"B","text":"Liên minh quân sự."},{"letter":"C","text":"Liên minh công nhân - trí thức."},{"letter":"D","text":"Liên minh công nhân - nông dân."}],"page":1,"correct":3},{"number":17,"question":"Theo Hồ Chí Minh, phương thức để xây dựng chủ nghĩa xã hội là gì?","options":[{"letter":"A","text":"Phải có sự giúp đỡ của các Đảng Cộng sản và các nước xã hội chủ nghĩa."},{"letter":"B","text":"Dựa vào chính quyền và sự hỗ trợ từ các quốc gia khác."},{"letter":"C","text":"Đem tài dân, sức dân, của dân để làm lợi cho dân."},{"letter":"D","text":"Nhà nước phải phân phối công bằng từ cấp trên xuống."}],"page":1,"correct":2},{"number":18,"question":"Chọn đáp án đúng điền vào chỗ trống: \"Mỗi đảng viên và cán bộ phải thấm nhuần (...), thật sự cần kiệm liêm chính, chí công vô tư. Phải giữ gìn Đảng ta thực sự trong sạch, phải xứng đáng là người lãnh đạo, là người đầy tớ thật trung thành của nhân dân\".","options":[{"letter":"A","text":"chủ nghĩa cộng sản."},{"letter":"B","text":"chủ nghĩa Mác - Lênin."},{"letter":"C","text":"tư tưởng chính trị."},{"letter":"D","text":"đạo đức cách mạng."}],"page":1,"correct":3},{"number":19,"question":"Theo quan niệm của Hồ Chí Minh, thành phần kinh tế nào được \"ưu tiên phát triển\" ở Việt Nam trong thời kỳ quá độ?","options":[{"letter":"A","text":"Kinh tế tư nhân."},{"letter":"B","text":"Kinh tế hợp tác xã."},{"letter":"C","text":"Kinh tế cá thể, tiểu chủ."},{"letter":"D","text":"Kinh tế quốc doanh."}],"page":1,"correct":3},{"number":20,"question":"Theo Hồ Chí Minh, động lực quan trọng và quyết định nhất trong công cuộc xây dựng chủ nghĩa xã hội ở Việt Nam là gì?","options":[{"letter":"A","text":"Độc lập."},{"letter":"B","text":"Tự do."},{"letter":"C","text":"Dân chủ."},{"letter":"D","text":"Con người."}],"page":1,"correct":3},{"number":21,"question":"Vận dụng quan điểm của Hồ Chí Minh về các thành phần kinh tế, hãy chỉ rõ thành phần kinh tế nào ở Việt Nam hiện nay được xác định giữ vai trò chủ đạo?","options":[{"letter":"A","text":"Tư nhân."},{"letter":"B","text":"Tư bản Nhà nước."},{"letter":"C","text":"Hợp tác xã."},{"letter":"D","text":"Nhà nước."}],"page":1,"correct":3},{"number":22,"question":"Điền vào chỗ trống: \"Tôi chỉ có một sự ham muốn, ham muốn tột bậc là làm sao cho nước ta được hoàn toàn độc lập, dân ta được hoàn toàn tự do, đồng bào (...)\"","options":[{"letter":"A","text":"ai cũng được hạnh phúc."},{"letter":"B","text":"ai cũng được tự do, tự do, hạnh phúc ai cũng được học hành."},{"letter":"C","text":"ai cũng được ấm no, được học hành, hạnh phúc."},{"letter":"D","text":"ai cũng có cơm ăn, áo mặc, ai cũng được học hành."}],"page":1,"correct":3},{"number":23,"question":"Theo Hồ Chí Minh, độc lập dân tộc bao gồm những nội dung gì?","options":[{"letter":"A","text":"Dân tộc và dân chủ."},{"letter":"B","text":"Dân trí và dân quyền."},{"letter":"C","text":"Dân tộc và giai cấp."},{"letter":"D","text":"Dân sinh và dân chủ."}],"page":1,"correct":0},{"number":24,"question":"Điền vào chỗ trống câu nói sau của Hồ Chí Minh: \"Toàn quốc đồng bào hãy đứng dậy (...) mà tự giải phóng cho ta\" (trích Thư kêu gọi Tổng khởi nghĩa, 1945).","options":[{"letter":"A","text":"đem sức ta."},{"letter":"B","text":"tận dụng sự hỗ trợ quốc tế."},{"letter":"C","text":"dựa vào ý chí đoàn kết của dân dưới sự lãnh đạo của Đảng."},{"letter":"D","text":"đem lực lượng."}],"page":1,"correct":0},{"number":25,"question":"Liên hệ thực tiễn quá trình xây dựng chủ nghĩa xã hội ở Việt Nam, lý giải tại sao xây dựng và chỉnh đốn Đảng lại là yếu tố quan trọng để giữ vững nền độc lập dân tộc?","options":[{"letter":"A","text":"Vì tăng cường xây dựng, chỉnh đốn Đảng nhằm đảm bảo thực hiện các nhiệm vụ phát triển kinh tế - xã hội."},{"letter":"B","text":"Vì xây dựng Đảng giúp ngăn chặn suy thoái tư tưởng chính trị, đạo đức, lối sống."},{"letter":"C","text":"Vì chỉnh đốn Đảng làm tăng tính cạnh tranh quốc tế."},{"letter":"D","text":"Tất cả các đáp án đều sai."}],"page":1,"correct":1},{"number":26,"question":"Trong Chánh cương vắn tắt của Đảng (1930), Hồ Chí Minh nêu rõ nhiệm vụ thứ nhất về phương diện chính trị cần","options":[{"letter":"A","text":"thủ tiêu hết các thứ quốc trái."},{"letter":"B","text":"đặt nhiệm vụ chống phong kiến lên hàng đầu."},{"letter":"C","text":"dân chúng được tự do tổ chức."},{"letter":"D","text":"đánh đổ đế quốc chủ nghĩa Pháp và bọn phong kiến."}],"page":1,"correct":3},{"number":27,"question":"Theo Hồ Chí Minh, giữa chủ nghĩa xã hội và chủ nghĩa cộng sản khác nhau là","options":[{"letter":"A","text":"chủ nghĩa xã hội vẫn còn chút vết tích xã hội cũ. Xã hội cộng sản thì hoàn toàn không còn vết tích xã hội cũ."},{"letter":"B","text":"chủ nghĩa xã hội vẫn còn giai cấp. Xã hội cộng sản không còn giai cấp và Nhà nước."},{"letter":"C","text":"chủ nghĩa xã hội vẫn kinh tế kinh tế hàng hóa. Xã hội cộng sản không còn kinh tế nhiều thành phần."},{"letter":"D","text":"chủ nghĩa xã hội còn tồn tại áp bức, bóc lột. Xã hội cộng sản không còn áp bức, bóc lột."}],"page":1,"correct":0},{"number":28,"question":"Theo Hồ Chí Minh, giai đoạn thấp của chủ nghĩa cộng sản là","options":[{"letter":"A","text":"thời kỳ quá độ."},{"letter":"B","text":"chủ nghĩa xã hội."},{"letter":"C","text":"chủ nghĩa dân tộc."},{"letter":"D","text":"chủ nghĩa quốc gia."}],"page":1,"correct":1},{"number":29,"question":"Theo Hồ Chí Minh, trong chế độ xã hội chủ nghĩa và cộng sản chủ nghĩa do ai làm chủ?","options":[{"letter":"A","text":"Công nhân và nông dân."},{"letter":"B","text":"Nhân dân lao động."},{"letter":"C","text":"Toàn thể nhân dân."},{"letter":"D","text":"Công nhân, nông dân, tư sản dân tộc."}],"page":1,"correct":1},{"number":30,"question":"Vận dụng nội dung tư tưởng Hồ Chí Minh về chủ nghĩa xã hội, Đại hội lần thứ XI của Đảng (2011) xác định: Xã hội mà nhân dân Việt Nam xây dựng gồm mấy đặc trưng?","options":[{"letter":"A","text":"6."},{"letter":"B","text":"7."},{"letter":"C","text":"8."},{"letter":"D","text":"9."}],"page":1,"correct":2},{"number":31,"question":"Từ thực tiễn thế giới và trong nước, năm 1991, Đại hội lần thứ VII của Đảng xác định: Xã hội chủ nghĩa ở Việt Nam là một xã hội","options":[{"letter":"A","text":"do nhân dân lao động làm chủ."},{"letter":"B","text":"quyền làm chủ của nhân dân được đảm bảo."},{"letter":"C","text":"nhân dân là người làm chủ."},{"letter":"D","text":"Tất cả các đáp án đều sai."}],"page":1,"correct":0},{"number":32,"question":"Trong học thuyết về hình thái kinh tế - xã hội, C. Mác khẳng định sự phát triển của xã hội loài người là quá trình","options":[{"letter":"A","text":"liên tục."},{"letter":"B","text":"không ngừng."},{"letter":"C","text":"từng giai đoạn."},{"letter":"D","text":"lịch sử - tự nhiên."}],"page":1,"correct":3},{"number":33,"question":"\"Sự sụp đổ của giai cấp tư sản và thắng lợi của giai cấp vô sản là (...)\". Hoàn thành câu nói trên của C. Mác?","options":[{"letter":"A","text":"tất yếu."},{"letter":"B","text":"tự nhiên."},{"letter":"C","text":"tất yếu như nhau."},{"letter":"D","text":"tự nhiên như nhau."}],"page":1,"correct":2},{"number":34,"question":"\"Chỉ có chủ nghĩa cộng sản mới cứu nhân loại, đem lại cho mọi người không phân biệt chủng tộc và (...), đoàn kết, ấm no trên quả đất, việc làm cho mọi người và vì mọi người, niềm vui, hòa bình, hạnh phúc\". Hoàn thành câu nói trên của Hồ Chí Minh?","options":[{"letter":"A","text":"nguồn gốc sự tự do, bình đẳng, bác ái."},{"letter":"B","text":"nguồn gốc của tự do, bình đẳng."},{"letter":"C","text":"nguồn gốc của độc lập, tự do, hạnh phúc."},{"letter":"D","text":"nguồn gốc của mọi giải phóng."}],"page":1,"correct":0},{"number":35,"question":"Theo Hồ Chí Minh, trong xã hội xã hội chủ nghĩa, địa vị cao nhất là ai?","options":[{"letter":"A","text":"Nhân dân."},{"letter":"B","text":"Trí thức."},{"letter":"C","text":"Công nhân và nông dân."},{"letter":"D","text":"Công nhân, nông dân và đội ngũ trí thức."}],"page":1,"correct":0},{"number":36,"question":"Quan hệ sản xuất trong xã hội xã hội chủ nghĩa được Hồ Chí Minh diễn đạt như thế nào?","options":[{"letter":"A","text":"Làm theo năng lực, hưởng theo lao động."},{"letter":"B","text":"Làm theo năng lực, hưởng theo nhu cầu."},{"letter":"C","text":"Lấy nhà máy, xe lửa, ngân hàng... làm của chung."},{"letter":"D","text":"Lấy ngân hàng, xe cộ, xí nghiệp... làm tài sản chung."}],"page":1,"correct":2},{"number":37,"question":"Nhiệm vụ nào dưới đây không được đề ra tại Đại hội Đảng lần thứ XII (2016)?","options":[{"letter":"A","text":"Thực hiện chính sách xã hội đúng đắn, công bằng vì con người, tạo động lực mạnh mẽ phát huy mọi năng lực sáng tạo của nhân dân trong sự nghiệp xây dựng và bảo vệ Tổ quốc."},{"letter":"B","text":"Xây dựng con người Việt Nam phát triển toàn diện là mục tiêu của chiến lược phát triển."},{"letter":"C","text":"Tạo môi trường và điều kiện để phát triển về nhân cách, đạo đức, trí tuệ, năng lực sáng tạo, thể chất, tâm hồn, trách nhiệm xã hội, nghĩa vụ công dân, ý thức tuân thủ pháp luật."},{"letter":"D","text":"Phát triển công nghiệp văn hóa đi đôi với xây dựng, hoàn thiện thị trường dịch vụ và sản phẩm văn hóa."}],"page":1,"correct":0},{"number":38,"question":"Vận dụng tư tưởng Hồ Chí Minh về xây dựng đội ngũ cán bộ, đảng viên \"thấm nhuần đạo đức cách mạng\", hiện nay có thể áp dụng những biện pháp nào?","options":[{"letter":"A","text":"Tập trung đào tạo về chuyên môn, không cần chú trọng đạo đức."},{"letter":"B","text":"Chỉ rèn luyện cán bộ ở các cơ quan cấp cao."},{"letter":"C","text":"Kết hợp giáo dục chính trị, tư tưởng và thực hành đạo đức trong mọi cấp, mọi ngành."},{"letter":"D","text":"Để mỗi cá nhân tự rèn luyện, không cần giám sát."}],"page":1,"correct":2},{"number":39,"question":"Chủ nghĩa xã hội là công trình tập thể của nhân dân dưới sự lãnh đạo của tổ chức nào?","options":[{"letter":"A","text":"Nhà nước của nhân dân, do nhân dân, vì nhân dân."},{"letter":"B","text":"Đảng Cộng sản."},{"letter":"C","text":"Mặt trận Tổ quốc Việt Nam."},{"letter":"D","text":"Đoàn Thanh niên Cộng sản Hồ Chí Minh."}],"page":1,"correct":1},{"number":40,"question":"Khi đề cập đến \"dân làm chủ\" và \"dân là chủ\", Hồ Chí Minh đã khẳng định điều gì?","options":[{"letter":"A","text":"Quyền lợi và quyền hạn, trách nhiệm và địa vị của nhân dân."},{"letter":"B","text":"Địa vị tuyệt đối của nhân dân trong hệ thống chính trị."},{"letter":"C","text":"Địa vị pháp lý của nhân dân trong Nhà nước."},{"letter":"D","text":"Quyền hành và lực lượng của người dân."}],"page":1,"correct":0},{"number":41,"question":"Theo Hồ Chí Minh, thành phần kinh tế nào là \"hình thức sở hữu của toàn dân, nó lãnh đạo nền kinh tế quốc dân và Nhà nước phải bảo đảm cho nó phát triển ưu tiên\"?","options":[{"letter":"A","text":"Kinh tế quốc doanh."},{"letter":"B","text":"Kinh tế hợp tác xã."},{"letter":"C","text":"Kinh tế tư nhân."},{"letter":"D","text":"Kinh tế có vốn đầu tư nước ngoài."}],"page":1,"correct":0},{"number":42,"question":"Theo Hồ Chí Minh, kinh tế quốc doanh có vai trò như thế nào trong nền kinh tế quốc dân?","options":[{"letter":"A","text":"Lãnh đạo."},{"letter":"B","text":"Dẫn dắt."},{"letter":"C","text":"Chi phối."},{"letter":"D","text":"Mở đường."}],"page":1,"correct":0},{"number":43,"question":"Theo Hồ Chí Minh, Nhà nước phải đặc biệt \"khuyến khích, hướng dẫn, giúp đỡ\" thành phần kinh tế nào?","options":[{"letter":"A","text":"Kinh tế quốc doanh."},{"letter":"B","text":"Kinh tế tư nhân."},{"letter":"C","text":"Kinh tế hợp tác xã."},{"letter":"D","text":"Kinh tế có vốn đầu tư nước ngoài."}],"page":1,"correct":2},{"number":44,"question":"Theo Hồ Chí Minh, điều kiện cho nhân dân tiến bộ là gì?","options":[{"let function shuffleArray(arr){
  const a = arr.slice();
  for (let i=a.length-1;i>0;i--){ const j=Math.floor(Math.random()*(i+1)); [a[i],a[j]]=[a[j],a[i]]; }
  return a;
}
const OPT_LETTERS=['A','B','C','D'];
function shuffleOptions(q){
  const idxs = shuffleArray(q.options.map((_,i)=>i));
  const newOptions = idxs.map((origIdx,pos)=>({letter:OPT_LETTERS[pos]||q.options[origIdx].letter, text:q.options[origIdx].text}));
  const newCorrect = idxs.indexOf(q.correct);
  return Object.assign({}, q, {options:newOptions, correct:newCorrect});
}

const ALL_QUESTIONS = QUIZ_DATA.flatMap(s=>s.questions.map(q=>({q, sec:s})));
const EXAM_SIZE = 50;

  const raw = JSON.parse(localStorage.getItem(EXAM_KEY)||'null');
  if (raw && Array.isArray(raw.questions) && raw.questions.length) examSession = raw;
} catch { examSession = null; }
function buildExamQuestions(){
  const picked = shuffleArray(ALL_QUESTIONS).slice(0, EXAM_SIZE);
  return picked.map((item,idx)=>{
    const shuffled = shuffleOptions(item.q);
    return {
      number: idx+1,
      question: shuffled.question,
      options: shuffled.options,
      correct: shuffled.correct,
      srcChapter: item.sec.chapter,
      srcTitle: item.sec.title
    };
  });
}
function newExam(){

  save();

}

const $ = id => document.getElementById(id);
const uid = (section,q) => section.id + '-q' + q.number;

function save(){ localStorage.setItem(STORAGE_KEY,JSON.stringify(answers)); }
function getStatsForSection(section){
  let done=0,correct=0;
  section.questions.forEach(q=>{
    const k=uid(section,q);
    if (Object.prototype.hasOwnProperty.call(answers,k)){
      done++; if (Number(answers[k])===q.correct) correct++;
    }
  });
  return {done,correct,total:section.questions.length};
}
function getGlobalStats(){
  let done=0,correct=0,total=0;
  QUIZ_DATA.forEach(s=>{const st=getStatsForSection(s);done+=st.done;correct+=st.correct;total+=st.total;});
  return {done,correct,total};
}
function getChapterStats(ch){
  let done=0,correct=0,total=0;
  QUIZ_DATA.filter(s=>s.chapter===ch).forEach(s=>{const st=getStatsForSection(s);done+=st.done;correct+=st.correct;total+=st.total;});
  return {done,correct,total};
}
function getExamStats(){
  let done=0,correct=0; const total=examSession.questions.length;
  examSession.questions.forEach(q=>{
    const k='exam-q'+q.number;
    if (Object.prototype.hasOwnProperty.call(answers,k)){ done++; if(Number(answers[k])===q.correct) correct++; }
  });
  return {done,correct,total};
}

function optionHTML(q,idx,selected,locked){
  const o=q.options[idx];
  let cls='option',icon='';
  if (locked && selected===idx){
    if (idx===q.correct){cls+=' correct-selected';icon='✓';}
    else {cls+=' wrong-selected';icon='×';}
  }
  return `<button type="button" class="${cls}" data-choice="${idx}" ${locked?'disabled':''}><span class="opt-letter">${o.letter}</span><span>${escapeHtml(o.text)}</span><span class="opt-icon">${icon}</span></button>`;
}
function escapeHtml(v){ return String(v).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[c])); }
function questionCard(section,q,displayNumber){
  const k=uid(section,q); const locked=Object.prototype.hasOwnProperty.call(answers,k); const selected=locked?Number(answers[k]):-1;
  const card=document.createElement('article'); card.className='question-card'+(locked?' answered':''); card.dataset.qid=k;
  let opts=''; q.options.forEach((_,i)=>opts+=optionHTML(q,i,selected,locked));
  let feedback='';
  if (locked && selected===q.correct){
    feedback='<div class="feedback correct">✓ Chính xác</div>';
  } else if (locked){
    const c=q.options[q.correct];
    feedback=`<div class="feedback wrong"><strong>Correct Answer: ${c.letter} :</strong> ${escapeHtml(c.text)}</div>`;
  }
  const srcTag = section.id==='exam' ? `<div class="src-tag">Nguồn: ${escapeHtml(q.srcTitle)}</div>` : '';
  card.innerHTML=`<div class="q-head"><div class="q-num">CÂU ${displayNumber||q.number}</div><div class="q-text">${escapeHtml(q.question)}</div></div>${srcTag}<div class="options">${opts}</div>${feedback}`;
  return card;
}
function renderQuestions(){

  if (s.id==='exam'){
    const st=getExamStats();

      root.appendChild(banner);
    }
  }
  const frag=document.createDocumentFragment(); s.questions.forEach((q,idx)=>frag.appendChild(questionCard(s,q,idx+1))); root.appendChild(frag);
}
function renderAll(scrollTop=false){

  if (scrollTop) window.scrollTo({top:0,behavior:'smooth'});

function choose(card,choice){
  const s=getSection(); const qnum=Number(card.dataset.qid.split('-q').pop()); const q=s.questions.find(x=>x.number===qnum); if(!q)return;
  const k=uid(s,q); if(Object.prototype.hasOwnProperty.call(answers,k)) return;
  answers[k]=choice; save();
  renderSidebar(); renderTopStats(); renderSectionHeader();
  if (s.id==='exam'){
    const st=getExamStats();
    if (st.done===st.total){ renderQuestions(); return; }
  }
  const idxInArr=s.questions.indexOf(q);
  const newCard=questionCard(s,q,idxInArr+1); card.replaceWith(newCard);
}

}

function startNewExam(){ newExam(); activeId='exam'; localStorage.setItem(SECTION_KEY,'exam'); renderAll(true); }

document.addEventListener('click',e=>{
  const choice=e.target.closest('[data-choice]'); if(choice){ const card=choice.closest('.question-card'); choose(card,Number(choice.dataset.choice)); return; }
  const sec=e.target.closest('[data-section]'); if(sec){ switchSection(sec.dataset.section); return; }
  const reset=e.target.closest('[data-reset-ch]'); if(reset){ resetChapter(reset.dataset.resetCh); return; }
  const newExamBtn=e.target.closest('[data-new-exam]'); if(newExamBtn){ startNewExam(); return; }
});
$('resetCurrent').addEventListener('click',()=>{
  if ($('resetCurrent').dataset.newExam==='1') startNewExam();
  else resetChapter($('resetCurrent').dataset.chapter);
});
$('shuffleBtn').addEventListener('click',()=>{
  if (activeId==='exam') return;
  const s=getSection();
  s.questions = shuffleArray(originalOrders[s.id]).map(q=>shuffleOptions(q));
  renderAll(true);
});
$('restoreOrderBtn').addEventListener('click',()=>{
  if (activeId==='exam') return;
  const s=getSection(); s.questions = originalOrders[s.id].slice();
  renderAll(true);
});
$('prevSection').addEventListener('click',()=>{const i=QUIZ_DATA.findIndex(x=>x.id===activeId);if(i>0)switchSection(QUIZ_DATA[i-1].id)});
$('nextSection').addEventListener('click',()=>{const i=QUIZ_DATA.findIndex(x=>x.id===activeId);if(i<QUIZ_DATA.length-1)switchSection(QUIZ_DATA[i+1].id)});
$('fontDown').addEventListener('click',()=>setFont(fontSize-1));
$('fontUp').addEventListener('click',()=>setFont(fontSize+1));
function setFont(v){fontSize=Math.max(14,Math.min(20,v));document.documentElement.style.setProperty('--base-font',fontSize+'px');localStorage.setItem(FONT_KEY,fontSize)}
window.addEventListener('scroll',()=>$('toTop').classList.toggle('show',window.scrollY>700),{passive:true});
$('toTop').addEventListener('click',()=>window.scrollTo({top:0,behavior:'smooth'}));
renderAll(false);
</script>
</body>
</html>
